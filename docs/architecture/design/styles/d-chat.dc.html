<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>D 软糖圆角 · 个人助理聊天</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=ZCOOL+KuaiLe&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3DF5}a:hover{color:#4328D6}
.root{--bg:#F4F1FB;--surface:#FFFFFF;--border:#E6E1F3;--text:#241E3A;--muted:#6B6484;--accent:#5B3DF5;--accent-ink:#FFFFFF;--accent-soft:#ECE7FF;--warm:#C93A26;--warm-ink:#FFFFFF;--warm-soft:#FDE7E3;--shadow:0 8px 24px rgba(72,48,160,0.12);--code:#F4F1FB}
.root.dark{--bg:#15112A;--surface:#221C3F;--border:#352D5C;--text:#F1ECFF;--muted:#AEA6CC;--accent:#A99BFF;--accent-ink:#1A1340;--accent-soft:#2E2659;--warm:#FF9A86;--warm-ink:#3A1410;--warm-soft:#45231F;--shadow:0 8px 24px rgba(0,0,0,0.35);--code:#1B1636}
.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.disp{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-weight:400}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;border-radius:999px}
.tab.on{color:var(--accent);background:var(--accent-soft);font-weight:700}
.bar{width:4px;border-radius:2px;background:currentColor}
.chip{font-size:11px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--warm-soft);color:var(--warm)}
</style>
</helmet>
<div class="root {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px; line-height: 1.5; --accent: {{accent}}">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 20px 8px">
    <h1 class="disp" style="margin: 0; font-size: 26px; line-height: 1.2">个人助理</h1>
    <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; box-shadow: var(--shadow)">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true" style="width: 16px; height: 16px"><path d="M12 5v14M5 12h14"/></svg>
      发起任务
    </button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; gap: 10px; align-items: flex-end">
      <div class="disp" style="width: 36px; height: 36px; border-radius: 50%; flex: none; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-size: 17px">狗</div>
      <div style="display: flex; flex-direction: column; gap: 4px; max-width: 296px">
        <div style="background: var(--surface); border-radius: 22px 22px 22px 6px; padding: 12px 16px; box-shadow: var(--shadow)">
          <p style="margin: 0; text-wrap: pretty">早上好。今天有两件事等你：「家庭照片整理与去重」第 2 阶段有一条命令要你批准；「交房租」的提醒 9 点到。</p>
        </div>
        <div style="font-size: 11px; color: var(--muted); padding-left: 12px">08:00</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
      <button type="button" aria-label="语音 6 秒，点一下播放，长按看更多" style="width: 250px; text-align: left; background: var(--accent); color: var(--accent-ink); border-radius: 22px 22px 6px 22px; padding: 10px 14px 10px 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow)">
        <span style="display: flex; align-items: center; gap: 10px">
          <span style="width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; flex: none">
            <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          </span>
          <span style="flex: 1; display: flex; align-items: center; gap: 3px; height: 24px">
            <i class="bar" style="height: 8px"></i><i class="bar" style="height: 14px"></i><i class="bar" style="height: 20px"></i><i class="bar" style="height: 12px"></i><i class="bar" style="height: 18px"></i><i class="bar" style="height: 24px"></i><i class="bar" style="height: 16px"></i><i class="bar" style="height: 10px"></i><i class="bar" style="height: 17px"></i><i class="bar" style="height: 22px"></i><i class="bar" style="height: 13px"></i><i class="bar" style="height: 9px"></i><i class="bar" style="height: 15px"></i><i class="bar" style="height: 19px"></i><i class="bar" style="height: 11px"></i><i class="bar" style="height: 7px"></i>
          </span>
          <span style="font-size: 13px; font-weight: 700">6″</span>
        </span>
        <span style="display: block; border-top: 1px solid rgba(255,255,255,0.3); padding: 8px 0 0 4px; font-size: 14px; line-height: 1.5">照片那个你先说说是什么命令，别急着删。</span>
      </button>
      <div style="font-size: 11px; color: var(--muted); padding-right: 12px">08:03</div>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-end">
      <div class="disp" style="width: 36px; height: 36px; border-radius: 50%; flex: none; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-size: 17px">狗</div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <button type="button" aria-label="语音 12 秒，点一下播放，长按转文字" style="width: 276px; text-align: left; background: var(--surface); border-radius: 22px 22px 22px 6px; padding: 10px 14px 10px 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow)">
          <span style="display: flex; align-items: center; gap: 10px; color: var(--accent)">
            <span style="width: 36px; height: 36px; border-radius: 50%; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex: none">
              <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
            </span>
            <span style="flex: 1; display: flex; align-items: center; gap: 3px; height: 24px">
              <i class="bar" style="height: 10px"></i><i class="bar" style="height: 16px"></i><i class="bar" style="height: 22px"></i><i class="bar" style="height: 14px"></i><i class="bar" style="height: 8px"></i><i class="bar" style="height: 18px"></i><i class="bar" style="height: 24px"></i><i class="bar" style="height: 12px"></i><i class="bar" style="height: 20px"></i><i class="bar" style="height: 11px"></i><i class="bar" style="height: 15px"></i><i class="bar" style="height: 21px"></i><i class="bar" style="height: 9px"></i><i class="bar" style="height: 17px"></i><i class="bar" style="height: 13px"></i><i class="bar" style="height: 19px"></i><i class="bar" style="height: 10px"></i><i class="bar" style="height: 7px"></i>
            </span>
            <span style="font-size: 13px; font-weight: 700; color: var(--muted)">12″</span>
          </span>
          <span style="display: block; border-top: 1px solid var(--border); padding: 6px 0 0 4px; font-size: 12px; color: var(--muted)">语音回复 · 长按转文字</span>
        </button>
        <div style="font-size: 11px; color: var(--muted); padding-left: 12px">08:03</div>
      </div>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start">
      <div class="disp" style="width: 36px; height: 36px; border-radius: 50%; flex: none; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-size: 17px">狗</div>
      <div style="display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 0">
        <section aria-label="审批卡" style="background: var(--surface); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow)">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="width: 40px; height: 40px; border-radius: 50%; background: var(--warm-soft); color: var(--warm); display: flex; align-items: center; justify-content: center; flex: none">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 20px; height: 20px"><path d="M12 3 4 6v6c0 4.5 3.4 7.9 8 9 4.6-1.1 8-4.5 8-9V6z"/><path d="M12 8v4M12 15h.01"/></svg>
            </span>
            <span style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
              <span class="disp" style="font-size: 17px; line-height: 1.2">要你批准</span>
              <span style="font-size: 11px; color: var(--muted)">先问我 · 卡住任务 · 有时限</span>
            </span>
          </div>
          <div style="font-size: 14px; font-weight: 500; line-height: 1.45">任务「家庭照片整理与去重」· 第 2 阶段 · 找出重复并移进回收区</div>
          <code style="display: block; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; padding: 10px 12px; border-radius: 14px; background: var(--code); word-break: break-all">rsync -av --delete /示例/相册/ 示例备份机:/相册/</code>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <span class="chip">删除或覆盖</span>
            <span class="chip">越出项目目录</span>
            <span class="chip" style="background: var(--accent-soft); color: var(--accent)">通用 bash</span>
          </div>
          <p style="margin: 0; font-size: 13px; color: var(--muted); line-height: 1.55">计划里授权的是「移进回收区」；这条命令会删掉备份端多出来的文件，超出了授权的对象范围。</p>
          <div style="display: flex; gap: 8px; padding-top: 2px">
            <button type="button" style="flex: 1; min-height: 46px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 700">拒绝</button>
            <button type="button" style="flex: 1.4; min-height: 46px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 700">批准这一次</button>
          </div>
        </section>
        <div style="font-size: 11px; color: var(--muted); padding-left: 12px">09:20</div>
      </div>
    </div>
  </main>

  <form style="position: relative; display: flex; align-items: center; gap: 6px; margin: 4px 12px 0; padding: 6px; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow)">
    <button type="button" aria-label="附件" style="width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent)">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <label for="d-msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">给个人助理发消息</label>
    <input id="d-msg" type="text" placeholder="给个人助理发消息" style="flex: 1; min-width: 0; height: 44px; padding: 0 8px; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 15px">
    <button type="button" aria-label="切换到语音输入" style="width: 44px; height: 44px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; color: var(--accent-ink)">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </form>

  <nav aria-label="主导航" style="display: flex; gap: 2px; margin: 10px 12px 14px; padding: 5px; background: var(--surface); border-radius: 999px; box-shadow: var(--shadow)">
    <button type="button" class="tab on" aria-current="page">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 0 1 12 4h1a8 8 0 0 1 8 8z"/></svg>
      <span>个人助理</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="m8 12 3 3 5-6"/></svg>
      <span>任务</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>项目</span>
    </button>
    <button type="button" class="tab">
      <span style="position: relative; display: flex">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <i style="position: absolute; top: -4px; right: -9px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--warm); color: var(--warm-ink); font-size: 10px; font-weight: 700; font-style: normal; display: flex; align-items: center; justify-content: center">3</i>
      </span>
      <span>待我处理</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
      <span>更多</span>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#5B3DF5","options":["#5B3DF5","#0E7C86","#C2410C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const picked = this.props.accent ?? '#5B3DF5';
    const accent = dark && picked.toUpperCase() === '#5B3DF5' ? '#A99BFF' : picked;
    return { themeClass: dark ? 'dark' : '', accent };
  }
}
</script>
</body>
</html>
