<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G 贴纸便当 · 个人助理聊天</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=ZCOOL+QingKe+HuangYou&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A2238}a:hover{color:#000}
.root{--bg:#FFF7E8;--surface:#FFFFFF;--ink:#2A2238;--text:#2A2238;--muted:#6E6478;--accent:#FFB950;--accent-ink:#2A2238;--mint:#CDEFD9;--peach:#FFD9C7;--warm:#D13B2B;--warm-ink:#FFFFFF;--code:#FFF1D6}
.root.dark{--bg:#1F1A2E;--surface:#2B2540;--ink:#F5EEFF;--text:#F5EEFF;--muted:#B9B0CC;--accent:#FFC46B;--accent-ink:#2A2238;--mint:#2B4A3C;--peach:#4A2F2A;--warm:#FF8C7A;--warm-ink:#2A1210;--code:#1F1A2E}
.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.disp{font-family:'ZCOOL QingKe HuangYou','Noto Sans SC',sans-serif;font-weight:400}
.stk{background:var(--surface);border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink)}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;border-radius:12px}
.tab.on{color:var(--accent-ink);background:var(--accent);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-weight:700}
.bar{width:4px;border-radius:2px;background:currentColor}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border:2px solid var(--ink);border-radius:999px;background:var(--peach);color:var(--text)}
.name{display:inline-block;padding:0 7px;background:var(--accent);color:var(--accent-ink);border:2px solid var(--ink);border-radius:8px;box-shadow:2px 2px 0 var(--ink);font-size:12px;font-weight:700;line-height:1.5;transform:rotate(-3deg);vertical-align:middle}
</style>
</helmet>
<div class="root {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px; line-height: 1.5; --accent: {{accent}}">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 20px 10px">
    <h1 class="disp" style="margin: 0; font-size: 28px; line-height: 1.2; display: flex; align-items: center; gap: 10px">个人助理 <span class="name" style="font-family: 'Noto Sans SC', sans-serif; font-size: 13px">二狗</span></h1>
    <button type="button" class="stk" style="min-height: 44px; padding: 0 14px; background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" style="width: 16px; height: 16px"><path d="M12 5v14M5 12h14"/></svg>发起任务</button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 10px 18px 10px; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; flex-direction: column; gap: 6px; max-width: 306px">
      <div style="display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted)"><span class="name">二狗</span>08:00</div>
      <div class="stk" style="padding: 12px 14px; border-radius: 4px 14px 14px 14px"><p style="margin: 0; text-wrap: pretty">早上好。今天有两件事等你：「家庭照片整理与去重」第 2 阶段有一条命令要你批准；「交房租」的提醒 9 点到。</p></div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
      <div style="font-size: 11px; color: var(--muted)">08:03</div>
      <button type="button" class="stk" aria-label="语音 6 秒，点一下播放，长按看更多" style="width: 246px; text-align: left; background: var(--accent); color: var(--accent-ink); border-radius: 14px 4px 14px 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
        <span style="display: flex; align-items: center; gap: 10px">
          <span style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); display: flex; align-items: center; justify-content: center; flex: none"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>
          <span style="flex: 1; display: flex; align-items: center; gap: 3px; height: 22px"><i class="bar" style="height: 6px"></i><i class="bar" style="height: 12px"></i><i class="bar" style="height: 18px"></i><i class="bar" style="height: 10px"></i><i class="bar" style="height: 16px"></i><i class="bar" style="height: 22px"></i><i class="bar" style="height: 14px"></i><i class="bar" style="height: 8px"></i><i class="bar" style="height: 15px"></i><i class="bar" style="height: 20px"></i><i class="bar" style="height: 11px"></i><i class="bar" style="height: 7px"></i><i class="bar" style="height: 13px"></i><i class="bar" style="height: 17px"></i><i class="bar" style="height: 9px"></i></span>
          <span style="font-size: 13px; font-weight: 700">6″</span>
        </span>
        <span style="display: block; border-top: 2px dotted var(--ink); padding-top: 8px; font-size: 14px; line-height: 1.5">照片那个你先说说是什么命令，别急着删。</span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted)"><span class="name">二狗</span>08:03</div>
      <button type="button" class="stk" aria-label="语音 12 秒，点一下播放，长按转文字" style="width: 276px; text-align: left; background: var(--mint); border-radius: 4px 14px 14px 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
        <span style="display: flex; align-items: center; gap: 10px">
          <span style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--ink); background: var(--surface); display: flex; align-items: center; justify-content: center; flex: none"><svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>
          <span style="flex: 1; display: flex; align-items: center; gap: 3px; height: 22px"><i class="bar" style="height: 8px"></i><i class="bar" style="height: 14px"></i><i class="bar" style="height: 20px"></i><i class="bar" style="height: 12px"></i><i class="bar" style="height: 6px"></i><i class="bar" style="height: 16px"></i><i class="bar" style="height: 22px"></i><i class="bar" style="height: 10px"></i><i class="bar" style="height: 18px"></i><i class="bar" style="height: 9px"></i><i class="bar" style="height: 13px"></i><i class="bar" style="height: 19px"></i><i class="bar" style="height: 7px"></i><i class="bar" style="height: 15px"></i><i class="bar" style="height: 11px"></i><i class="bar" style="height: 17px"></i><i class="bar" style="height: 8px"></i><i class="bar" style="height: 5px"></i></span>
          <span style="font-size: 13px; font-weight: 700; color: var(--muted)">12″</span>
        </span>
        <span style="display: block; border-top: 2px dotted var(--ink); padding-top: 6px; font-size: 12px; color: var(--muted)">语音回复 · 长按转文字</span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--muted)"><span class="name">二狗</span>09:20</div>
      <p style="margin: 0">守卫判定「先问我」，命令我先拦下了：</p>
      <section class="stk" aria-label="审批卡" style="padding: 14px; display: flex; flex-direction: column; gap: 10px; border-radius: 16px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span class="disp" style="font-size: 20px; line-height: 1.2">要你批准</span>
          <span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border: 2px solid var(--ink); border-radius: 999px; background: var(--warm); color: var(--warm-ink)">有时限</span>
        </div>
        <div style="font-size: 14px; font-weight: 500; line-height: 1.45">任务「家庭照片整理与去重」· 第 2 阶段 · 找出重复并移进回收区</div>
        <code style="display: block; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; padding: 8px 10px; border: 2px dashed var(--ink); border-radius: 10px; background: var(--code); word-break: break-all">rsync -av --delete /示例/相册/ 示例备份机:/相册/</code>
        <div style="display: flex; flex-wrap: wrap; gap: 6px"><span class="chip">删除或覆盖</span><span class="chip">越出项目目录</span><span class="chip" style="background: var(--mint)">通用 bash · 先问我</span></div>
        <p style="margin: 0; font-size: 13px; color: var(--muted); line-height: 1.55">计划里授权的是「移进回收区」；这条命令会删掉备份端多出来的文件，超出了授权的对象范围。</p>
        <div style="display: flex; gap: 10px; padding-top: 2px">
          <button type="button" class="stk" style="flex: 1; min-height: 44px; font-size: 14px; font-weight: 700; border-radius: 12px">拒绝</button>
          <button type="button" class="stk" style="flex: 1.4; min-height: 44px; background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 700; border-radius: 12px">批准这一次</button>
        </div>
      </section>
    </div>
  </main>

  <form class="stk" style="position: relative; display: flex; align-items: center; gap: 8px; margin: 0 16px; padding: 6px; border-radius: 16px">
    <button type="button" aria-label="附件" style="width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--ink); background: var(--peach); display: flex; align-items: center; justify-content: center; color: var(--ink)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <div style="position: relative; flex: 1; min-width: 0; height: 44px">
      <label for="g-msg" style="position: absolute; left: 8px; top: 0; height: 44px; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 15px; pointer-events: none">和 <span class="name">二狗</span> 说…</label>
      <input id="g-msg" type="text" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 8px; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 15px">
    </div>
    <button type="button" aria-label="切换到语音输入" style="width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--ink); background: var(--accent); display: flex; align-items: center; justify-content: center; color: var(--accent-ink)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  </form>

  <nav aria-label="主导航" style="display: flex; gap: 4px; margin: 12px 16px 14px; padding: 0">
    <button type="button" class="tab on" aria-current="page"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 0 1 12 4h1a8 8 0 0 1 8 8z"/></svg><span>个人助理</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="m8 12 3 3 5-6"/></svg><span>任务</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>项目</span></button>
    <button type="button" class="tab"><span style="position: relative; display: flex"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i style="position: absolute; top: -6px; right: -10px; min-width: 19px; height: 19px; padding: 0 4px; border-radius: 10px; border: 2px solid var(--ink); background: var(--warm); color: var(--warm-ink); font-size: 10px; font-weight: 700; font-style: normal; display: flex; align-items: center; justify-content: center">3</i></span><span>待我处理</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg><span>更多</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#FFB950","options":["#FFB950","#8FD3F4","#F9A8D4"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const picked = this.props.accent ?? '#FFB950';
    const accent = dark && picked.toUpperCase() === '#FFB950' ? '#FFC46B' : picked;
    return { themeClass: dark ? 'dark' : '', accent };
  }
}
</script>
</body>
</html>
