<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>I 水墨国风 · 任务看板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&amp;family=Ma+Shan+Zheng&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B3261E}a:hover{color:#8E1D17}
.root{--bg:#FBFAF7;--surface:#FFFFFF;--text:#222222;--muted:#6A6A66;--accent:#B3261E;--accent-ink:#FFFFFF;--accent-soft:#F6E7E4;--rule:rgba(0,0,0,0.2);--wash:#EFEDE6;--ink:#1A1A1A;--ink-on:#FBFAF7}
.root.dark{--bg:#141413;--surface:#1E1E1C;--text:#ECE8DF;--muted:#A39E93;--accent:#E0574B;--accent-ink:#1A0C0A;--accent-soft:#3A2320;--rule:rgba(255,255,255,0.2);--wash:#26262A;--ink:#ECE8DF;--ink-on:#141413}
.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.cal{font-family:'Ma Shan Zheng','Noto Serif SC',serif;font-weight:400}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;position:relative}
.tab.on{color:var(--accent);font-weight:600}
.tab.on::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;background:var(--accent)}
.gh{display:flex;align-items:baseline;gap:10px;padding:6px 2px 4px;border-bottom:1px solid var(--rule)}
.gh b{font-size:24px;font-family:'Ma Shan Zheng','Noto Serif SC',serif;font-weight:400;line-height:1.1}
.gh span{font-size:12px;color:var(--muted);letter-spacing:0.06em}
.gh em{margin-left:auto;font-style:normal;font-size:12px;color:var(--accent)}
.row{width:100%;text-align:left;display:flex;flex-direction:column;gap:3px;padding:11px 2px;border-bottom:1px dashed var(--rule)}
.row h3{margin:0;font-size:15px;font-weight:600;line-height:1.5}
.row p{margin:0;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 12px;letter-spacing:0.02em}
.you{color:var(--accent)}
.you::before{content:"";display:inline-block;width:6px;height:6px;background:var(--accent);margin-right:6px;vertical-align:1px}
.run::before{content:"";display:inline-block;width:6px;height:6px;border:1px solid var(--ink);margin-right:6px;vertical-align:1px;box-sizing:border-box}
</style>
</helmet>
<div class="root {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 15px; line-height: 1.7; --accent: {{accent}}">

  <header style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 22px 22px 12px; border-bottom: 1px solid var(--rule)">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 class="cal" style="margin: 0; font-size: 30px; line-height: 1.2">任务看板</h1>
      <div style="font-size: 12px; color: var(--muted); letter-spacing: 0.1em">五件等我 · 三件进行中</div>
    </div>
    <button type="button" style="min-height: 44px; padding: 0 12px; border: 1px solid var(--ink); border-radius: 2px; font-size: 14px; letter-spacing: 0.1em">发起任务</button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 22px; display: flex; flex-direction: column; gap: 16px">

    <section style="display: flex; flex-direction: column">
      <div class="gh"><b>等我</b><span>等我、待确认</span><em>五</em></div>
      <button type="button" class="row"><h3>季度体检报告整理</h3><p><span class="you">等你验收</span><span>第 3/3 阶段</span><span>9.6 万 token</span><span>昨天 18:00</span></p></button>
      <button type="button" class="row"><h3>VPS 证书续期检查</h3><p><span class="you">中断：不确定续期命令是否已执行</span><span>第 2/2 阶段</span><span>1.2 万 token</span></p></button>
      <button type="button" class="row"><h3>个税年度汇算材料</h3><p><span class="you">超预算，要你决定</span><span>第 2/3 阶段</span><span>64 万 token</span></p></button>
    </section>

    <section style="display: flex; flex-direction: column">
      <div class="gh"><b>进行中</b><span>规划中、排队中、执行中</span><em>三</em></div>
      <button type="button" class="row"><h3>博客迁移到 Astro</h3><p><span class="run">执行中 · 跑端到端测试</span><span>第 3/5 阶段</span><span>35.6 万 token</span><span>个人博客</span></p></button>
      <button type="button" class="row"><h3>十一月东京行程</h3><p><span class="run">规划中 · 和你对齐意图</span><span>0.8 万 token</span></p></button>
      <button type="button" class="row"><h3>家庭网盘去重</h3><p><span>排队中 · 等项目「家庭网盘」</span></p></button>
    </section>

    <section style="display: flex; flex-direction: column">
      <div class="gh"><b>运营中</b><span>提醒、定时作业</span><em>四</em></div>
      <button type="button" class="row"><h3>每天 08:00 出早报</h3><p><span class="run">运营中 · 上次成功</span><span>按我的工作日 08:00</span><span>9.6 万 token</span></p></button>
      <button type="button" class="row"><h3>每天 21:00 汇总当天账单</h3><p><span class="you">上次失败 · 21:00 再跑</span><span>记账本</span><span>21.4 万 token</span></p></button>
      <button type="button" class="row"><h3>交房租</h3><p><span>提醒 · 明天 09:00</span><span>每月 8 号</span></p></button>
    </section>

    <section style="display: flex; flex-direction: column">
      <div class="gh"><b>最近结束</b><span>完成、失败、取消</span><em>三</em></div>
      <button type="button" class="row" style="color: var(--muted)"><h3 style="font-weight: 400">简历更新</h3><p><span>已完成 · 第 2/2 阶段</span><span>8.8 万 token</span><span>10-05</span></p></button>
    </section>
  </main>

  <nav aria-label="主导航" style="display: flex; padding: 0 8px 10px; border-top: 1px solid var(--rule)">
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 0 1 12 4h1a8 8 0 0 1 8 8z"/></svg><span>个人助理</span></button>
    <button type="button" class="tab on" aria-current="page"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="m8 12 3 3 5-6"/></svg><span>任务</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>项目</span></button>
    <button type="button" class="tab"><span style="position: relative; display: flex"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i style="position: absolute; top: -4px; right: -8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 2px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-style: normal; display: flex; align-items: center; justify-content: center">3</i></span><span>待我处理</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg><span>更多</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#B3261E","options":["#B3261E","#1F5E8C","#2E6B4A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const picked = this.props.accent ?? '#B3261E';
    const accent = dark && picked.toUpperCase() === '#B3261E' ? '#E0574B' : picked;
    return { themeClass: dark ? 'dark' : '', accent };
  }
}
</script>
</body>
</html>
