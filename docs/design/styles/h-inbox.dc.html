<style>
body{margin:0}
a{color:#2F7A4F}a:hover{color:#1F5A38}
.root{--bg:#E9F5E1;--surface:#FFFFFF;--ink:#2B3A2E;--text:#22302A;--muted:#53665A;--accent:#2F7A4F;--accent-ink:#FFFFFF;--accent-soft:#CFEBD8;--pink:#F2A7C1;--pink-ink:#3A1A28;--warm:#C9372C;--warn-ink:#FFFFFF;--code:#EEF6EA}

.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}

.bit{font-family:'Press Start 2P','Noto Sans SC',monospace;font-size:9px;letter-spacing:0}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11px;margin:3px}
.tab.on{color:var(--accent-ink);background:var(--accent);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),3px 0 0 0 var(--ink),-3px 0 0 0 var(--ink);font-weight:700}
.seg{flex:1;min-height:38px;margin:3px;font-size:13px;color:var(--muted);font-weight:700}
.seg.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),3px 0 0 0 var(--ink),-3px 0 0 0 var(--ink)}
.gh{display:flex;align-items:center;gap:8px;padding:8px 6px 2px;font-size:12px;font-weight:700;color:var(--muted)}
.row{width:100%;text-align:left;display:flex;align-items:center;gap:12px;margin:0 3px;padding:11px 12px}
.av{width:36px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--text);box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),2px 0 0 0 var(--ink),-2px 0 0 0 var(--ink);margin:2px}
.av.warm{background:var(--pink);color:var(--pink-ink)}
.av svg{width:18px;height:18px}
.row h3{margin:0;font-size:14px;font-weight:700;line-height:1.4}
.row.read h3{font-weight:500}
.row p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.dot{width:10px;height:10px;background:var(--warm);flex:none;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),2px 0 0 0 var(--ink),-2px 0 0 0 var(--ink);margin:2px}
</style>
</helmet>

  </main>

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#2F7A4F","options":["#2F7A4F","#2563A8","#9A3F8C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const picked = this.props.accent ?? '#2F7A4F';

</script>
