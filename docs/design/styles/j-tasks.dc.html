<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>J 复古杂志 · 任务看板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;900&amp;family=Noto+Sans+SC:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7A5F0E}a:hover{color:#171511}
.root{--bg:#F3EFE4;--surface:#FBF8F1;--text:#171511;--muted:#5E584C;--accent:#D4A72C;--accent-ink:#171511;--accent-text:#7A5F0E;--rule:#171511;--rule-on:#F3EFE4;--warm:#B3261E;--warn-ink:#FFFFFF}
.root.dark{--bg:#161411;--surface:#1F1C18;--text:#F1ECE0;--muted:#AFA796;--accent:#E2B33A;--accent-ink:#171511;--accent-text:#E2B33A;--rule:#F1ECE0;--rule-on:#161411;--warm:#FF8B7A;--warn-ink:#2A1210}
.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.sans{font-family:'Noto Sans SC','PingFang SC',sans-serif}
.hd{font-family:'Noto Serif SC','Songti SC',serif;font-weight:900}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;letter-spacing:0.08em;position:relative}
.tab.on{color:var(--text);font-weight:500}
.tab.on::after{content:"";position:absolute;bottom:6px;width:24px;height:3px;background:var(--accent)}
.lbl{font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:0.14em;color:var(--muted)}
.dbl{border-top:3px solid var(--rule);box-shadow:0 -5px 0 0 var(--bg),0 -6px 0 0 var(--rule)}
.gh{display:flex;align-items:baseline;gap:10px;padding:10px 0 4px}
.gh i{font-family:'Noto Serif SC',serif;font-weight:900;font-style:normal;font-size:26px;line-height:1;color:var(--accent-text)}
.gh b{font-family:'Noto Serif SC',serif;font-weight:900;font-size:20px;line-height:1.1}
.gh em{margin-left:auto;font-style:normal}
.row{width:100%;text-align:left;display:flex;flex-direction:column;gap:3px;padding:10px 0;border-bottom:1px solid var(--rule)}
.row h3{margin:0;font-size:16px;font-weight:400;line-height:1.45}
.row p{margin:0;font-family:'Noto Sans SC',sans-serif;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;letter-spacing:0.02em}
.you{color:var(--text);font-weight:500;background:var(--accent);padding:0 5px}
.run{color:var(--text);font-weight:500}
</style>
</helmet>
<div class="root {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Noto Serif SC', 'Songti SC', serif; font-size: 15px; line-height: 1.65; --accent: {{accent}}">

  <header style="display: flex; flex-direction: column; gap: 8px; padding: 18px 20px 10px; border-bottom: 3px solid var(--rule)">
    <div class="lbl" style="display: flex; justify-content: space-between"><span>看板 · 5 等我 · 3 进行中 · 4 运营中</span><span>10 月 7 日</span></div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
      <h1 class="hd" style="margin: 0; font-size: 30px; line-height: 1.1">任务看板</h1>
      <button type="button" class="sans" style="min-height: 44px; padding: 0 12px; background: var(--rule); color: var(--rule-on); font-size: 13px; font-weight: 500; letter-spacing: 0.08em">发起任务</button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 20px; display: flex; flex-direction: column; gap: 10px">

    <section style="display: flex; flex-direction: column">
      <div class="gh"><i>01</i><b>等我</b><span class="lbl">等我、待确认</span><em class="lbl">5 件</em></div>
      <button type="button" class="row dbl" style="padding-top: 12px"><h3>季度体检报告整理</h3><p><span class="you">等你验收</span><span>第 3/3 阶段</span><span>9.6 万 token</span><span>昨天 18:00</span></p></button>
      <button type="button" class="row"><h3>VPS 证书续期检查</h3><p><span class="you">中断：不确定续期命令是否已执行</span><span>第 2/2 阶段</span><span>1.2 万 token</span></p></button>
      <button type="button" class="row"><h3>个税年度汇算材料</h3><p><span class="you">超预算</span><span>第 2/3 阶段</span><span>64 万 token</span><span>昨天 16:45</span></p></button>
    </section>

    <section style="display: flex; flex-direction: column">
      <div class="gh"><i>02</i><b>进行中</b><span class="lbl">规划中、排队中、执行中</span><em class="lbl">3 件</em></div>
      <button type="button" class="row dbl" style="padding-top: 12px"><h3>博客迁移到 Astro</h3><p><span class="run">执行中 · 跑端到端测试</span><span>第 3/5 阶段</span><span>35.6 万 token</span><span>个人博客</span></p></button>
      <button type="button" class="row"><h3>十一月东京行程</h3><p><span class="run">规划中 · 和你对齐意图</span><span>0.8 万 token</span></p></button>
      <button type="button" class="row"><h3>家庭网盘去重</h3><p><span>排队中 · 等项目「家庭网盘」</span></p></button>
    </section>

    <section style="display: flex; flex-direction: column">
      <div class="gh"><i>03</i><b>运营中</b><span class="lbl">提醒、定时作业</span><em class="lbl">4 件</em></div>
      <button type="button" class="row dbl" style="padding-top: 12px"><h3>每天 08:00 出早报</h3><p><span class="run">运营中 · 上次成功</span><span>按我的工作日 08:00</span><span>9.6 万 token</span></p></button>
      <button type="button" class="row"><h3>每天 21:00 汇总当天账单</h3><p><span class="you">上次失败</span><span>每天 21:00</span><span>记账本</span><span>21.4 万 token</span></p></button>
    </section>

    <section style="display: flex; flex-direction: column">
      <div class="gh"><i>04</i><b>最近结束</b><span class="lbl">完成、失败、取消</span><em class="lbl">3 件</em></div>
      <button type="button" class="row dbl" style="padding-top: 12px; color: var(--muted)"><h3>简历更新</h3><p><span>已完成 · 第 2/2 阶段</span><span>8.8 万 token</span><span>10-05</span></p></button>
    </section>
  </main>

  <nav aria-label="主导航" class="sans dbl" style="display: flex; padding: 0 6px 10px; margin-top: 6px">
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 0 1 12 4h1a8 8 0 0 1 8 8z"/></svg><span>个人助理</span></button>
    <button type="button" class="tab on" aria-current="page"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16"/><path d="m8 12 3 3 5-6"/></svg><span>任务</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>项目</span></button>
    <button type="button" class="tab"><span style="position: relative; display: flex"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i style="position: absolute; top: -4px; right: -8px; min-width: 16px; height: 16px; padding: 0 4px; background: var(--warm); color: var(--warn-ink); font-size: 10px; font-weight: 500; font-style: normal; display: flex; align-items: center; justify-content: center">3</i></span><span>待我处理</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>更多</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#D4A72C","options":["#D4A72C","#E07A5F","#8FB6D9"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const picked = this.props.accent ?? '#D4A72C';
    const accent = dark && picked.toUpperCase() === '#D4A72C' ? '#E2B33A' : picked;
    return { themeClass: dark ? 'dark' : '', accent };
  }
}
</script>
</body>
</html>
