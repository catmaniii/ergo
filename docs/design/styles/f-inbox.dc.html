<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>F 工程蓝图 · 待我处理</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E3A8A}a:hover{color:#172C6B}
.root{--bg:#F7F9FC;--grid:#DCE4F2;--surface:#FFFFFF;--line:#1E3A8A;--text:#0F1E45;--muted:#4B5A80;--accent:#1E3A8A;--accent-ink:#FFFFFF;--accent-soft:#E3EAF8;--warn:#C2410C;--warn-ink:#FFFFFF}
.root.dark{--bg:#0D1B3E;--grid:#1C2D5C;--surface:#112353;--line:#9DB4FF;--text:#E6ECFF;--muted:#A4B2D9;--accent:#9DB4FF;--accent-ink:#0D1B3E;--accent-soft:#1C2D5C;--warn:#FFB070;--warn-ink:#2A1200}
.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.mono{font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;font-weight:500}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;position:relative}
.tab.on{color:var(--accent);font-weight:700}
.tab.on::before{content:"";position:absolute;top:-1.5px;left:12px;right:12px;height:3px;background:var(--accent)}
.lbl{font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase}
.seg{flex:1;min-height:40px;font-size:13px;color:var(--muted);border:1.5px solid var(--line);margin-left:-1.5px}
.seg.on{background:var(--line);color:var(--bg);font-weight:700}
.gh{display:flex;align-items:center;gap:8px;padding:6px 2px 2px;font-size:11px;color:var(--muted)}
.gh::after{content:"";flex:1;height:0;border-top:1px dashed var(--line)}
.row{width:100%;text-align:left;display:flex;align-items:flex-start;gap:10px;padding:11px 12px;background:var(--surface);border:1px solid var(--line)}
.row.unread{border-width:1.5px}
.dot{width:8px;height:8px;margin-top:7px;flex:none;background:var(--warn)}
.dot.read{background:transparent;border:1px solid var(--line)}
.row h3{margin:0;font-size:14px;font-weight:500;line-height:1.45}
.row.unread h3{font-weight:700}
.row p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.kind{color:var(--accent);font-weight:700}
</style>
</helmet>
<div class="root {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; color: var(--text); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px; line-height: 1.5; --accent: {{accent}}">

  <header style="display: flex; flex-direction: column; gap: 10px; padding: 0 16px 12px; background: var(--surface); border-bottom: 1.5px solid var(--line)">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px">
      <div style="display: flex; flex-direction: column; gap: 1px">
        <div class="mono lbl">INBOX / 3 未读 · 2 卡着任务</div>
        <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.2">待我处理</h1>
      </div>
      <button type="button" style="min-height: 44px; padding: 0 10px; color: var(--accent); font-size: 13px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px">全部标已读</button>
    </div>
    <div style="display: flex; padding-left: 1.5px">
      <button type="button" class="seg on" aria-pressed="true">待处理 <span class="mono">6</span></button>
      <button type="button" class="seg" aria-pressed="false">已处理 <span class="mono">4</span></button>
      <button type="button" class="seg" aria-pressed="false">已归档 <span class="mono">2</span></button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 6px">
    <div class="gh mono">A · 置顶 · 到点的提醒</div>
    <button type="button" class="row unread"><i class="dot" aria-label="未读"></i><span style="flex: 1; min-width: 0"><h3>该交房租了</h3><p><span class="kind">提醒</span> · 简单提醒 · <span class="mono">09:00</span></p></span></button>

    <div class="gh mono">B · 卡住任务 · 有时限</div>
    <button type="button" class="row unread"><i class="dot" aria-label="未读"></i><span style="flex: 1; min-width: 0"><h3>批准一条命令：rsync --delete 到备份机</h3><p><span class="kind">审批</span> · 任务「家庭照片整理与去重」· <span class="mono">09:20</span></p></span></button>
    <button type="button" class="row"><i class="dot read"></i><span style="flex: 1; min-width: 0"><h3>授权明天到期：移动重复照片</h3><p><span class="kind">授权到期续期</span> · 任务「家庭照片整理与去重」· <span class="mono">08:00</span></p></span></button>

    <div class="gh mono">C · 卡住任务</div>
    <button type="button" class="row unread"><i class="dot" aria-label="未读"></i><span style="flex: 1; min-width: 0"><h3>NAS 硬盘巡检卡住了：smartctl 读不到第 3 块盘</h3><p><span class="kind">卡住求助</span> · 任务「NAS 硬盘健康巡检」· <span class="mono">06:30</span></p></span></button>
    <button type="button" class="row"><i class="dot read"></i><span style="flex: 1; min-width: 0"><h3>新设备请求配对：iPad</h3><p><span class="kind">配对请求</span> · 系统 · 昨天 <span class="mono">22:14</span></p></span></button>

    <div class="gh mono">D · 不卡任务</div>
    <button type="button" class="row"><i class="dot read"></i><span style="flex: 1; min-width: 0"><h3>昨晚的备份没写进同步目录</h3><p><span class="kind">备份失败</span> · 系统 · <span class="mono">03:31</span></p></span></button>
    <button type="button" class="row"><i class="dot read"></i><span style="flex: 1; min-width: 0"><h3>越界通知：维护者想读 ~/Documents</h3><p><span class="kind">越界通知</span> · 项目「记账本」· 昨天 <span class="mono">20:05</span></p></span></button>
  </main>

  <nav aria-label="主导航" style="display: flex; padding: 0 6px 10px; background: var(--surface); border-top: 1.5px solid var(--line)">
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 0 1 12 4h1a8 8 0 0 1 8 8z"/></svg><span>个人助理</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="4" y="4" width="16" height="16"/><path d="m8 12 3 3 5-6"/></svg><span>任务</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 5h6l2 2h10v13H3z"/></svg><span>项目</span></button>
    <button type="button" class="tab on" aria-current="page"><span style="position: relative; display: flex"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i class="mono" style="position: absolute; top: -4px; right: -9px; min-width: 17px; height: 17px; padding: 0 4px; background: var(--warn); color: var(--warn-ink); font-size: 10px; font-weight: 600; font-style: normal; display: flex; align-items: center; justify-content: center">3</i></span><span>待我处理</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3.5" y="10.5" width="3" height="3"/><rect x="10.5" y="10.5" width="3" height="3"/><rect x="17.5" y="10.5" width="3" height="3"/></svg><span>更多</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#1E3A8A","options":["#1E3A8A","#0F5132","#7F1D1D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const picked = this.props.accent ?? '#1E3A8A';
    const accent = dark && picked.toUpperCase() === '#1E3A8A' ? '#9DB4FF' : picked;
    return { themeClass: dark ? 'dark' : '', accent };
  }
}
</script>
</body>
</html>
