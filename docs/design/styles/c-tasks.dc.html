<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C 夜航仪表 · 任务看板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4FD1C5}a:hover{color:#8FE3DB}
.root{--bg:#EEF2F6;--surface:#FFFFFF;--raised:#F6F8FA;--border:#D5DCE5;--text:#0F172A;--muted:#5B6778;--accent:#0F766E;--accent-ink:#FFFFFF;--accent-dim:rgba(15,118,110,0.12);--warn:#B45309;--warn-dim:rgba(180,83,9,0.12)}
.root.dark{--bg:#0C1017;--surface:#141A23;--raised:#1B2330;--border:#263040;--text:#E3E9F2;--muted:#93A1B3;--accent:#4FD1C5;--accent-ink:#06211E;--accent-dim:rgba(79,209,197,0.14);--warn:#F6AD55;--warn-dim:rgba(246,173,85,0.16)}
.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;position:relative}
.tab.on{color:var(--accent)}
.tab.on::before{content:"";position:absolute;top:0;width:28px;height:2px;border-radius:1px;background:var(--accent)}
.gh{display:flex;align-items:center;gap:8px;padding:8px 2px 6px}
.gh b{font-size:13px;font-weight:700}
.gh span{font-size:11px;color:var(--muted)}
.gh em{margin-left:auto;font-style:normal;font-size:11px;color:var(--muted);padding:1px 7px;border-radius:999px;background:var(--raised);border:1px solid var(--border)}
.card{width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:15px;font-weight:500;line-height:1.4}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.p-you{background:var(--warn-dim);color:var(--warn)}
.p-run{background:var(--accent-dim);color:var(--accent)}
.p-idle{background:var(--raised);color:var(--muted);border:1px solid var(--border)}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.track{height:3px;border-radius:2px;background:var(--border);overflow:hidden}
.fill{height:100%;background:var(--accent)}
</style>
</helmet>
<div class="root {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px; line-height: 1.5; --accent: {{accent}}">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 56px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border)">
    <div style="display: flex; flex-direction: column; gap: 1px">
      <h1 style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2">任务看板</h1>
      <div class="mono" style="font-size: 11px; color: var(--muted)">5 等我 · 3 进行中 · 4 运营中</div>
    </div>
    <button type="button" style="min-height: 40px; padding: 0 12px; border-radius: 8px; background: var(--accent-dim); color: var(--accent); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width: 16px; height: 16px"><path d="M12 5v14M5 12h14"/></svg>
      发起任务
    </button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 10px 16px; display: flex; flex-direction: column; gap: 12px">

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div class="gh"><b>等我</b><span>等我、待确认</span><em class="mono">5</em></div>
      <button type="button" class="card">
        <div class="top"><h3>季度体检报告整理</h3><span class="pill p-you"><i></i>等你验收</span></div>
        <div class="track"><div class="fill" style="width: 100%"></div></div>
        <div class="meta"><span class="mono">3/3 阶段</span><span class="mono">96k token</span><span>昨天 18:00</span></div>
      </button>
      <button type="button" class="card">
        <div class="top"><h3>VPS 证书续期检查</h3><span class="pill p-you"><i></i>中断</span></div>
        <div style="font-size: 12px; color: var(--warn)">不确定续期命令是否已执行，要你核对</div>
        <div class="meta"><span class="mono">2/2 阶段</span><span class="mono">12k token</span><span>07:02</span></div>
      </button>
      <button type="button" class="card">
        <div class="top"><h3>个税年度汇算材料</h3><span class="pill p-you"><i></i>超预算</span></div>
        <div class="track"><div class="fill" style="width: 66%; background: var(--warn)"></div></div>
        <div class="meta"><span class="mono">2/3 阶段</span><span class="mono">640k token</span><span>昨天 16:45</span></div>
      </button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div class="gh"><b>进行中</b><span>规划中、排队中、执行中</span><em class="mono">3</em></div>
      <button type="button" class="card">
        <div class="top"><h3>博客迁移到 Astro</h3><span class="pill p-run"><i></i>执行中</span></div>
        <div style="font-size: 12px; color: var(--muted)">跑端到端测试 · 项目「个人博客」</div>
        <div class="track"><div class="fill" style="width: 60%"></div></div>
        <div class="meta"><span class="mono">3/5 阶段</span><span class="mono">356k token</span><span>09:10</span></div>
      </button>
      <button type="button" class="card">
        <div class="top"><h3>十一月东京行程</h3><span class="pill p-run"><i></i>规划中</span></div>
        <div class="meta"><span>和你对齐意图</span><span class="mono">8k token</span><span>08:31</span></div>
      </button>
      <button type="button" class="card">
        <div class="top"><h3>家庭网盘去重</h3><span class="pill p-idle"><i></i>排队中</span></div>
        <div class="meta"><span>等项目「家庭网盘」</span><span class="mono">0 token</span></div>
      </button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div class="gh"><b>运营中</b><span>提醒、定时作业</span><em class="mono">4</em></div>
      <button type="button" class="card">
        <div class="top"><h3>每天 08:00 出早报</h3><span class="pill p-run"><i></i>运营中</span></div>
        <div class="meta"><span>按我的工作日 08:00</span><span>上次 <span class="mono">08:00</span> 成功</span><span class="mono">96k token</span></div>
      </button>
      <button type="button" class="card">
        <div class="top"><h3>每天 21:00 汇总当天账单</h3><span class="pill p-you"><i></i>上次失败</span></div>
        <div class="meta"><span>每天 21:00</span><span>项目「记账本」</span><span class="mono">214k token</span></div>
      </button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div class="gh"><b>最近结束</b><span>完成、失败、取消</span><em class="mono">3</em></div>
      <button type="button" class="card" style="opacity: 0.75">
        <div class="top"><h3>简历更新</h3><span class="pill p-idle"><i></i>已完成</span></div>
        <div class="meta"><span class="mono">2/2 阶段</span><span class="mono">88k token</span><span>10-05</span></div>
      </button>
    </section>
  </main>

  <nav aria-label="主导航" style="display: flex; padding: 0 6px 10px; background: var(--surface); border-top: 1px solid var(--border)">
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 0 1 12 4h1a8 8 0 0 1 8 8z"/></svg>
      <span>个人助理</span>
    </button>
    <button type="button" class="tab on" aria-current="page">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8 12 3 3 5-6"/></svg>
      <span>任务</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>项目</span>
    </button>
    <button type="button" class="tab">
      <span style="position: relative; display: flex">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <i class="mono" style="position: absolute; top: -4px; right: -9px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--warn); color: #1A1206; font-size: 10px; font-weight: 600; font-style: normal; display: flex; align-items: center; justify-content: center">3</i>
      </span>
      <span>待我处理</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      <span>更多</span>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#4FD1C5","options":["#4FD1C5","#7AA2F7","#F6AD55"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true;
    const picked = this.props.accent ?? '#4FD1C5';
    const accent = !dark && picked.toUpperCase() === '#4FD1C5' ? '#0F766E' : picked;
    return { themeClass: dark ? 'dark' : '', accent };
  }
}
</script>
</body>
</html>
