<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>E 玻璃光纹 · 个人助理聊天</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Chakra+Petch:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457F5}a:hover{color:#1A43C4}
.root{--bg:#EEF1F8;--dot:#C6CDE0;--surface:rgba(255,255,255,0.74);--edge:rgba(255,255,255,0.9);--border:rgba(30,41,82,0.12);--text:#121A33;--muted:#566078;--accent:#2457F5;--accent-ink:#FFFFFF;--accent-soft:rgba(36,87,245,0.12);--glow:0 1px 0 rgba(255,255,255,0.9) inset,0 10px 30px rgba(36,87,245,0.10);--warn:#B8321A;--warn-ink:#FFFFFF;--code:rgba(18,26,51,0.06)}
.root.dark{--bg:#0B0E1A;--dot:#283052;--surface:rgba(24,29,52,0.72);--edge:rgba(255,255,255,0.12);--border:rgba(255,255,255,0.1);--text:#E8ECFF;--muted:#9AA3C7;--accent:#7C9CFF;--accent-ink:#0B0E1A;--accent-soft:rgba(124,156,255,0.16);--glow:0 1px 0 rgba(255,255,255,0.08) inset,0 10px 30px rgba(0,0,0,0.45);--warn:#FF8A6A;--warn-ink:#2A0E06;--code:rgba(255,255,255,0.07)}
.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.num{font-family:'Chakra Petch','Noto Sans SC',sans-serif;font-weight:600;letter-spacing:0.02em}
.glass{background:var(--surface);border:1px solid var(--edge);box-shadow:var(--glow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;position:relative}
.tab.on{color:var(--accent);font-weight:700}
.tab.on::after{content:"";position:absolute;bottom:5px;width:18px;height:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.bar{width:2px;border-radius:1px;background:currentColor}
.chip{font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--border);color:var(--muted)}
.name{display:inline-flex;align-items:center;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);font-size:12px;font-weight:700;line-height:1.4;vertical-align:middle}
</style>
</helmet>
<div class="root {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.3px); background-size: 18px 18px; color: var(--text); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px; line-height: 1.5; --accent: {{accent}}">

  <header class="glass" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 12px 0; padding: 12px 16px; border-radius: 16px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.2; display: flex; align-items: center; gap: 8px">个人助理 <span class="name">二狗</span></h1>
      <div class="num" style="font-size: 11px; color: var(--muted)">10.07 WED · 秘书主线</div>
    </div>
    <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; box-shadow: 0 6px 18px var(--accent-soft)">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width: 16px; height: 16px"><path d="M12 5v14M5 12h14"/></svg>
      发起任务
    </button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; flex-direction: column; gap: 5px; max-width: 310px">
      <div style="font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center"><span class="name">二狗</span><span class="num">08:00</span></div>
      <div class="glass" style="border-radius: 4px 16px 16px 16px; padding: 12px 14px">
        <p style="margin: 0; text-wrap: pretty">早上好。今天有两件事等你：「家庭照片整理与去重」第 2 阶段有一条命令要你批准；「交房租」的提醒 9 点到。</p>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 5px">
      <div class="num" style="font-size: 11px; color: var(--muted)">08:03</div>
      <button type="button" aria-label="语音 6 秒，点一下播放，长按看更多" style="width: 244px; text-align: left; background: var(--accent); color: var(--accent-ink); border-radius: 16px 4px 16px 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 8px 24px var(--accent-soft)">
        <span style="display: flex; align-items: center; gap: 10px">
          <span style="width: 30px; height: 30px; border-radius: 10px; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; flex: none">
            <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          </span>
          <span style="flex: 1; display: flex; align-items: center; gap: 3px; height: 22px">
            <i class="bar" style="height: 6px"></i><i class="bar" style="height: 12px"></i><i class="bar" style="height: 18px"></i><i class="bar" style="height: 10px"></i><i class="bar" style="height: 16px"></i><i class="bar" style="height: 22px"></i><i class="bar" style="height: 14px"></i><i class="bar" style="height: 8px"></i><i class="bar" style="height: 15px"></i><i class="bar" style="height: 20px"></i><i class="bar" style="height: 11px"></i><i class="bar" style="height: 7px"></i><i class="bar" style="height: 13px"></i><i class="bar" style="height: 17px"></i><i class="bar" style="height: 9px"></i><i class="bar" style="height: 5px"></i><i class="bar" style="height: 12px"></i><i class="bar" style="height: 8px"></i><i class="bar" style="height: 4px"></i>
          </span>
          <span class="num" style="font-size: 12px">0:06</span>
        </span>
        <span style="display: block; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 8px; font-size: 14px; line-height: 1.5">照片那个你先说说是什么命令，别急着删。</span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 5px">
      <div style="font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center"><span class="name">二狗</span><span class="num">08:03</span></div>
      <button type="button" class="glass" aria-label="语音 12 秒，点一下播放，长按转文字" style="width: 276px; text-align: left; border-radius: 4px 16px 16px 16px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px">
        <span style="display: flex; align-items: center; gap: 10px; color: var(--accent)">
          <span style="width: 30px; height: 30px; border-radius: 10px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; flex: none">
            <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          </span>
          <span style="flex: 1; display: flex; align-items: center; gap: 3px; height: 22px">
            <i class="bar" style="height: 8px"></i><i class="bar" style="height: 14px"></i><i class="bar" style="height: 20px"></i><i class="bar" style="height: 12px"></i><i class="bar" style="height: 6px"></i><i class="bar" style="height: 16px"></i><i class="bar" style="height: 22px"></i><i class="bar" style="height: 10px"></i><i class="bar" style="height: 18px"></i><i class="bar" style="height: 9px"></i><i class="bar" style="height: 13px"></i><i class="bar" style="height: 19px"></i><i class="bar" style="height: 7px"></i><i class="bar" style="height: 15px"></i><i class="bar" style="height: 11px"></i><i class="bar" style="height: 17px"></i><i class="bar" style="height: 8px"></i><i class="bar" style="height: 5px"></i><i class="bar" style="height: 12px"></i><i class="bar" style="height: 14px"></i><i class="bar" style="height: 6px"></i><i class="bar" style="height: 4px"></i>
          </span>
          <span class="num" style="font-size: 12px; color: var(--muted)">0:12</span>
        </span>
        <span style="display: block; border-top: 1px solid var(--border); padding-top: 6px; font-size: 12px; color: var(--muted)">语音回复 · 长按转文字</span>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 11px; color: var(--muted); display: flex; gap: 8px; align-items: center"><span class="name">二狗</span><span class="num">09:20</span></div>
      <p style="margin: 0">守卫判定「先问我」，命令我先拦下了：</p>
      <section class="glass" aria-label="审批卡" style="border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          <span class="num" style="font-size: 11px; padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent)">审批 · 先问我</span>
          <span class="num" style="font-size: 11px; color: var(--warn)">卡住任务 · 有时限</span>
        </div>
        <div style="font-size: 14px; font-weight: 500; line-height: 1.45">任务「家庭照片整理与去重」· 第 2 阶段 · 找出重复并移进回收区</div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 12px; color: var(--muted)">通用 bash</div>
          <code style="display: block; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; padding: 8px 10px; border-radius: 10px; background: var(--code); word-break: break-all">rsync -av --delete /示例/相册/ 示例备份机:/相册/</code>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <span class="chip">删除或覆盖</span>
          <span class="chip">越出项目目录</span>
        </div>
        <p style="margin: 0; font-size: 13px; color: var(--muted); line-height: 1.55">计划里授权的是「移进回收区」；这条命令会删掉备份端多出来的文件，超出了授权的对象范围。</p>
        <div style="display: flex; gap: 8px; padding-top: 2px">
          <button type="button" style="flex: 1; min-height: 44px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-weight: 500">拒绝</button>
          <button type="button" style="flex: 1.4; min-height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-size: 14px; font-weight: 700; box-shadow: 0 6px 18px var(--accent-soft)">批准这一次</button>
        </div>
      </section>
    </div>
  </main>

  <form class="glass" style="position: relative; display: flex; align-items: center; gap: 8px; margin: 0 12px; padding: 8px; border-radius: 18px">
    <button type="button" aria-label="附件" style="width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--muted); border: 1px solid var(--border)">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div style="position: relative; flex: 1; min-width: 0; height: 44px">
      <label for="e-msg" style="position: absolute; left: 12px; top: 0; height: 44px; display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 15px; pointer-events: none">和 <span class="name">二狗</span> 说…</label>
      <input id="e-msg" type="text" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 12px; border: 0; border-radius: 12px; background: transparent; color: var(--text); font: inherit; font-size: 15px">
    </div>
    <button type="button" aria-label="切换到语音输入" style="width: 44px; height: 44px; border-radius: 12px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; color: var(--accent)">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
  </form>

  <nav class="glass" aria-label="主导航" style="display: flex; margin: 10px 12px 12px; padding: 0 4px; border-radius: 18px">
    <button type="button" class="tab on" aria-current="page">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 0 1 12 4h1a8 8 0 0 1 8 8z"/></svg>
      <span>个人助理</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8 12 3 3 5-6"/></svg>
      <span>任务</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>项目</span>
    </button>
    <button type="button" class="tab">
      <span style="position: relative; display: flex">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <i class="num" style="position: absolute; top: -4px; right: -9px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 6px; background: var(--warn); color: var(--warn-ink); font-size: 10px; font-style: normal; display: flex; align-items: center; justify-content: center">3</i>
      </span>
      <span>待我处理</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span>更多</span>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#2457F5","options":["#2457F5","#7C3AED","#0E8A7D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const picked = this.props.accent ?? '#2457F5';
    const accent = dark && picked.toUpperCase() === '#2457F5' ? '#7C9CFF' : picked;
    return { themeClass: dark ? 'dark' : '', accent };
  }
}
</script>
</body>
</html>
