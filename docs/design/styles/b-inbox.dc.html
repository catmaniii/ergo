<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>B 净白格栅 · 待我处理</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
.root{--bg:#FFFFFF;--alt:#F5F5F5;--border:#E4E4E4;--text:#111111;--muted:#5F6368;--accent:#C2410C;--accent-ink:#FFFFFF;--ink:#111111;--ink-on:#FFFFFF}
.root.dark{--bg:#0B0B0C;--alt:#19191B;--border:#2A2A2D;--text:#F2F2F2;--muted:#A3A3A3;--accent:#FF8A4C;--accent-ink:#111111;--ink:#F2F2F2;--ink-on:#111111}
.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px}
.tab.on{color:var(--text);font-weight:700}
.seg{min-height:44px;padding:0 2px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg.on{color:var(--text);font-weight:700;border-bottom-color:var(--text)}
.gh{font-size:11px;letter-spacing:0.12em;font-weight:700;color:var(--muted);padding:14px 0 4px}
.row{width:100%;text-align:left;display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--accent)}
.dot.read{background:transparent;border:1px solid var(--border)}
.row h3{margin:0;font-size:15px;font-weight:500;line-height:1.4}
.row.unread h3{font-weight:700}
.row p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.kind{color:var(--text);font-weight:500}
</style>
</helmet>
<div class="root {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; --accent: {{accent}}">

  <header style="display: flex; flex-direction: column; padding: 0 16px; border-bottom: 1px solid var(--border)">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px">
      <h1 style="margin: 0; font-size: 17px; font-weight: 700">待我处理 <span style="font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 6px">3 条未读</span></h1>
      <button type="button" style="min-height: 44px; padding: 0 4px; font-size: 14px; font-weight: 500">全部标已读</button>
    </div>
    <div style="display: flex; gap: 20px">
      <button type="button" class="seg on" aria-pressed="true">待处理 6</button>
      <button type="button" class="seg" aria-pressed="false">已处理 4</button>
      <button type="button" class="seg" aria-pressed="false">已归档 2</button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column">
    <div class="gh">置顶 · 到点的提醒</div>
    <button type="button" class="row unread">
      <i class="dot" aria-label="未读"></i>
      <span style="flex: 1; min-width: 0"><h3>该交房租了</h3><p><span class="kind">提醒</span> · 简单提醒 · 09:00</p></span>
    </button>

    <div class="gh">卡住任务 · 有时限</div>
    <button type="button" class="row unread">
      <i class="dot" aria-label="未读"></i>
      <span style="flex: 1; min-width: 0"><h3>批准一条命令：rsync --delete 到备份机</h3><p><span class="kind">审批</span> · 任务「家庭照片整理与去重」· 09:20</p></span>
    </button>
    <button type="button" class="row">
      <i class="dot read"></i>
      <span style="flex: 1; min-width: 0"><h3>授权明天到期：移动重复照片</h3><p><span class="kind">授权到期续期</span> · 任务「家庭照片整理与去重」· 08:00</p></span>
    </button>

    <div class="gh">卡住任务</div>
    <button type="button" class="row unread">
      <i class="dot" aria-label="未读"></i>
      <span style="flex: 1; min-width: 0"><h3>NAS 硬盘巡检卡住了：smartctl 读不到第 3 块盘</h3><p><span class="kind">卡住求助</span> · 任务「NAS 硬盘健康巡检」· 06:30</p></span>
    </button>
    <button type="button" class="row">
      <i class="dot read"></i>
      <span style="flex: 1; min-width: 0"><h3>新设备请求配对：iPad</h3><p><span class="kind">配对请求</span> · 系统 · 昨天 22:14</p></span>
    </button>

    <div class="gh">不卡任务</div>
    <button type="button" class="row">
      <i class="dot read"></i>
      <span style="flex: 1; min-width: 0"><h3>昨晚的备份没写进同步目录</h3><p><span class="kind">备份失败</span> · 系统 · 03:31</p></span>
    </button>
    <button type="button" class="row">
      <i class="dot read"></i>
      <span style="flex: 1; min-width: 0"><h3>越界通知：维护者想读 ~/Documents</h3><p><span class="kind">越界通知</span> · 项目「记账本」· 昨天 20:05</p></span>
    </button>
    <button type="button" class="row">
      <i class="dot read"></i>
      <span style="flex: 1; min-width: 0"><h3>「盯特价机票」失败了</h3><p><span class="kind">失败后的抉择</span> · 任务「盯特价机票」· 10-04</p></span>
    </button>
    <p style="margin: 14px 0 0; font-size: 12px; color: var(--muted); line-height: 1.6">进了这里的事，个人助理不主动转述。卡着任务的事项要先处理，才能归档或删除。</p>
  </main>

  <nav aria-label="主导航" style="display: flex; padding: 0 4px 10px; border-top: 1px solid var(--border)">
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 0 1 12 4h1a8 8 0 0 1 8 8z"/></svg>
      <span>个人助理</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 12 3 3 5-6"/></svg>
      <span>任务</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>项目</span>
    </button>
    <button type="button" class="tab on" aria-current="page">
      <span style="position: relative; display: flex">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <i style="position: absolute; top: -3px; right: -8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 3px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; font-style: normal; display: flex; align-items: center; justify-content: center">3</i>
      </span>
      <span>待我处理</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      <span>更多</span>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4ED8","#047857"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const picked = this.props.accent ?? '#C2410C';
    const accent = dark && picked.toUpperCase() === '#C2410C' ? '#FF8A4C' : picked;
    return { themeClass: dark ? 'dark' : '', accent };
  }
}
</script>
</body>
</html>
