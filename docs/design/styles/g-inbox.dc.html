<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>G 贴纸便当 · 待我处理</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=ZCOOL+QingKe+HuangYou&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2A2238}a:hover{color:#000}
.root{--bg:#FFF7E8;--surface:#FFFFFF;--ink:#2A2238;--text:#2A2238;--muted:#6E6478;--accent:#FFB950;--accent-ink:#2A2238;--mint:#CDEFD9;--peach:#FFD9C7;--warm:#D13B2B;--warm-ink:#FFFFFF}
.root.dark{--bg:#1F1A2E;--surface:#2B2540;--ink:#F5EEFF;--text:#F5EEFF;--muted:#B9B0CC;--accent:#FFC46B;--accent-ink:#2A2238;--mint:#2B4A3C;--peach:#4A2F2A;--warm:#FF8C7A;--warm-ink:#2A1210}
.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.disp{font-family:'ZCOOL QingKe HuangYou','Noto Sans SC',sans-serif;font-weight:400}
.stk{background:var(--surface);border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink)}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;border-radius:12px}
.tab.on{color:var(--accent-ink);background:var(--accent);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);font-weight:700}
.seg{flex:1;min-height:40px;border-radius:999px;font-size:13px;color:var(--muted);font-weight:700}
.seg.on{background:var(--accent);color:var(--accent-ink);border:2px solid var(--ink)}
.gh{font-size:12px;color:var(--muted);padding:8px 6px 2px;font-weight:700}
.row{width:100%;text-align:left;display:flex;align-items:center;gap:12px;padding:12px 14px}
.row.read{box-shadow:none}
.av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;border:2px solid var(--ink);background:var(--mint);color:var(--ink)}
.av.warm{background:var(--peach)}
.av svg{width:20px;height:20px}
.row h3{margin:0;font-size:14px;font-weight:700;line-height:1.4}
.row.read h3{font-weight:500}
.row p{margin:2px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.dot{width:12px;height:12px;border-radius:50%;background:var(--warm);border:2px solid var(--ink);flex:none}
</style>
</helmet>
<div class="root {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px; line-height: 1.5; --accent: {{accent}}">

  <header style="display: flex; flex-direction: column; gap: 12px; padding: 20px 20px 8px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h1 class="disp" style="margin: 0; font-size: 28px; line-height: 1.2; display: flex; align-items: center; gap: 10px">待我处理 <span style="font-family: 'Noto Sans SC', sans-serif; font-size: 12px; font-weight: 700; padding: 2px 9px; border: 2px solid var(--ink); border-radius: 999px; background: var(--warm); color: var(--warm-ink)">3 未读</span></h1>
      <button type="button" style="min-height: 44px; padding: 0 8px; font-size: 14px; font-weight: 700; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px">全部标已读</button>
    </div>
    <div class="stk" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px">
      <button type="button" class="seg on" aria-pressed="true">待处理 6</button>
      <button type="button" class="seg" aria-pressed="false">已处理 4</button>
      <button type="button" class="seg" aria-pressed="false">已归档 2</button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 18px 12px; display: flex; flex-direction: column; gap: 10px">
    <div class="gh">置顶 · 到点的提醒</div>
    <button type="button" class="row stk"><span class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 2M9 3h6"/></svg></span><span style="flex: 1; min-width: 0"><h3>该交房租了</h3><p>提醒 · 简单提醒 · 09:00</p></span><i class="dot" aria-label="未读"></i></button>

    <div class="gh">卡住任务 · 有时限</div>
    <button type="button" class="row stk"><span class="av warm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 7.9 8 9 4.6-1.1 8-4.5 8-9V6z"/><path d="M12 8v4M12 15h.01"/></svg></span><span style="flex: 1; min-width: 0"><h3>批准一条命令：rsync --delete 到备份机</h3><p>审批 · 任务「家庭照片整理与去重」· 09:20</p></span><i class="dot" aria-label="未读"></i></button>
    <button type="button" class="row stk read"><span class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12 20 3M16 7l2 2M18 5l2 2"/></svg></span><span style="flex: 1; min-width: 0"><h3>授权明天到期：移动重复照片</h3><p>授权到期续期 · 任务「家庭照片整理与去重」· 08:00</p></span></button>

    <div class="gh">卡住任务</div>
    <button type="button" class="row stk"><span class="av warm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11a5 5 0 0 1 10 0c0 3-2 3-2 6H9c0-3-2-3-2-6z"/><path d="M10 21h4"/></svg></span><span style="flex: 1; min-width: 0"><h3>NAS 硬盘巡检卡住了：smartctl 读不到第 3 块盘</h3><p>卡住求助 · 任务「NAS 硬盘健康巡检」· 06:30</p></span><i class="dot" aria-label="未读"></i></button>
    <button type="button" class="row stk read"><span class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M12 17h.01"/></svg></span><span style="flex: 1; min-width: 0"><h3>新设备请求配对：iPad</h3><p>配对请求 · 系统 · 昨天 22:14</p></span></button>

    <div class="gh">不卡任务</div>
    <button type="button" class="row stk read"><span class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v2H4zM4 11h16v6a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3z"/><path d="M8 15h.01"/></svg></span><span style="flex: 1; min-width: 0"><h3>昨晚的备份没写进同步目录</h3><p>备份失败 · 系统 · 03:31</p></span></button>
    <button type="button" class="row stk read"><span class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v12H8l-4 4z"/><path d="M12 8v4M12 14h.01"/></svg></span><span style="flex: 1; min-width: 0"><h3>越界通知：维护者想读 ~/Documents</h3><p>越界通知 · 项目「记账本」· 昨天 20:05</p></span></button>
  </main>

  <nav aria-label="主导航" style="display: flex; gap: 4px; margin: 10px 16px 14px">
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 0 1 12 4h1a8 8 0 0 1 8 8z"/></svg><span>个人助理</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="m8 12 3 3 5-6"/></svg><span>任务</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>项目</span></button>
    <button type="button" class="tab on" aria-current="page"><span style="position: relative; display: flex"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><i style="position: absolute; top: -6px; right: -10px; min-width: 19px; height: 19px; padding: 0 4px; border-radius: 10px; border: 2px solid var(--ink); background: var(--warm); color: var(--warm-ink); font-size: 10px; font-weight: 700; font-style: normal; display: flex; align-items: center; justify-content: center">3</i></span><span>待我处理</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg><span>更多</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#FFB950","options":["#FFB950","#8FD3F4","#F9A8D4"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const picked = this.props.accent ?? '#FFB950';
    const accent = dark && picked.toUpperCase() === '#FFB950' ? '#FFC46B' : picked;
    return { themeClass: dark ? 'dark' : '', accent };
  }
}
</script>
</body>
</html>
