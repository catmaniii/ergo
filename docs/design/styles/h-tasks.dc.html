<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>H 像素小屋 · 任务看板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2F7A4F}a:hover{color:#1F5A38}
.root{--bg:#E9F5E1;--surface:#FFFFFF;--ink:#2B3A2E;--text:#22302A;--muted:#53665A;--accent:#2F7A4F;--accent-ink:#FFFFFF;--accent-soft:#CFEBD8;--pink:#F2A7C1;--pink-ink:#3A1A28;--warm:#C9372C;--warn-ink:#FFFFFF;--code:#EEF6EA}
.root.dark{--bg:#1B2430;--surface:#273242;--ink:#E6EEF5;--text:#E6EEF5;--muted:#A7B5C4;--accent:#7DD3A0;--accent-ink:#0F1F17;--accent-soft:#2F4A3D;--pink:#F2A7C1;--pink-ink:#3A1A28;--warm:#FF8A7A;--warn-ink:#2A1210;--code:#1B2430}
.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.px{background:var(--surface);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),3px 0 0 0 var(--ink),-3px 0 0 0 var(--ink)}
.bit{font-family:'Press Start 2P','Noto Sans SC',monospace;font-size:9px;letter-spacing:0}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:11px;margin:3px}
.tab.on{color:var(--accent-ink);background:var(--accent);box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),3px 0 0 0 var(--ink),-3px 0 0 0 var(--ink);font-weight:700}
.gh{display:flex;align-items:center;gap:8px;padding:6px 6px 2px}
.gh b{font-size:15px;font-weight:700}
.gh span{font-size:11px;color:var(--muted)}
.gh em{margin-left:auto;font-style:normal;color:var(--accent-ink);background:var(--accent);padding:3px 5px}
.card{width:100%;text-align:left;margin:0 3px;padding:11px 14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:15px;font-weight:500;line-height:1.4}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tag{font-size:10px;font-weight:700;padding:2px 6px;white-space:nowrap;margin:2px;box-shadow:0 -2px 0 0 var(--ink),0 2px 0 0 var(--ink),2px 0 0 0 var(--ink),-2px 0 0 0 var(--ink)}
.t-you{background:var(--pink);color:var(--pink-ink)}
.t-run{background:var(--accent-soft);color:var(--text)}
.t-idle{background:var(--surface);color:var(--muted)}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.hp{display:flex;gap:2px;height:8px}
.hp i{flex:1;background:var(--code);border:1px solid var(--ink)}
.hp i.on{background:var(--accent)}
</style>
</helmet>
<div class="root {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg); background-image: linear-gradient(rgba(43,58,46,0.06) 2px, transparent 2px), linear-gradient(90deg, rgba(43,58,46,0.06) 2px, transparent 2px); background-size: 16px 16px; color: var(--text); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px; line-height: 1.5; --accent: {{accent}}">

  <header class="px" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px 15px 0; padding: 10px 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div class="bit" style="color: var(--muted)">QUEST BOARD</div>
      <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.2">任务看板</h1>
    </div>
    <button type="button" class="px" style="min-height: 40px; margin: 3px; padding: 0 12px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="width: 14px; height: 14px"><path d="M10 4h4v6h6v4h-6v6h-4v-6H4v-4h6z"/></svg>发起任务</button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 18px; display: flex; flex-direction: column; gap: 12px">

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div class="gh"><b>等我</b><span>等我、待确认</span><em class="bit">05</em></div>
      <button type="button" class="card px"><div class="top"><h3>季度体检报告整理</h3><span class="tag t-you">等你验收</span></div><div class="hp"><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="meta"><span class="bit">3/3</span><span class="bit">96K TOKEN</span><span>昨天 18:00</span></div></button>
      <button type="button" class="card px"><div class="top"><h3>VPS 证书续期检查</h3><span class="tag t-you">中断</span></div><div style="font-size: 12px; color: var(--warm); font-weight: 700">不确定续期命令是否已执行，要你核对</div><div class="meta"><span class="bit">2/2</span><span class="bit">12K TOKEN</span><span>07:02</span></div></button>
      <button type="button" class="card px"><div class="top"><h3>个税年度汇算材料</h3><span class="tag t-you">超预算</span></div><div class="hp"><i class="on"></i><i class="on"></i><i></i></div><div class="meta"><span class="bit">2/3</span><span class="bit">640K TOKEN</span><span>昨天 16:45</span></div></button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div class="gh"><b>进行中</b><span>规划中、排队中、执行中</span><em class="bit">03</em></div>
      <button type="button" class="card px"><div class="top"><h3>博客迁移到 Astro</h3><span class="tag t-run">执行中</span></div><div style="font-size: 12px; color: var(--muted)">跑端到端测试 · 项目「个人博客」</div><div class="hp"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div><div class="meta"><span class="bit">3/5</span><span class="bit">356K TOKEN</span><span>09:10</span></div></button>
      <button type="button" class="card px"><div class="top"><h3>十一月东京行程</h3><span class="tag t-run">规划中</span></div><div class="meta"><span>和你对齐意图</span><span class="bit">8K TOKEN</span><span>08:31</span></div></button>
      <button type="button" class="card px"><div class="top"><h3>家庭网盘去重</h3><span class="tag t-idle">排队中</span></div><div class="meta"><span>等项目「家庭网盘」</span></div></button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div class="gh"><b>运营中</b><span>提醒、定时作业</span><em class="bit">04</em></div>
      <button type="button" class="card px"><div class="top"><h3>每天 08:00 出早报</h3><span class="tag t-run">运营中</span></div><div class="meta"><span>按我的工作日 08:00</span><span>上次成功</span><span class="bit">96K TOKEN</span></div></button>
      <button type="button" class="card px"><div class="top"><h3>每天 21:00 汇总当天账单</h3><span class="tag t-you">上次失败</span></div><div class="meta"><span>每天 21:00</span><span>记账本</span><span class="bit">214K TOKEN</span></div></button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <div class="gh"><b>最近结束</b><span>完成、失败、取消</span><em class="bit">03</em></div>
      <button type="button" class="card px" style="opacity: 0.75"><div class="top"><h3>简历更新</h3><span class="tag t-idle">已完成</span></div><div class="meta"><span class="bit">2/2</span><span class="bit">88K TOKEN</span><span>10-05</span></div></button>
    </section>
  </main>

  <nav aria-label="主导航" class="px" style="display: flex; margin: 0 15px 14px; padding: 2px 4px">
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M4 4h16v12h-8l-4 4v-4H4z"/></svg><span>个人助理</span></button>
    <button type="button" class="tab on" aria-current="page"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><rect x="4" y="4" width="16" height="16"/><path d="m8 12 3 3 5-6"/></svg><span>任务</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 5h6l2 2h10v13H3z"/></svg><span>项目</span></button>
    <button type="button" class="tab"><span style="position: relative; display: flex"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20h4"/></svg><i class="bit" style="position: absolute; top: -6px; right: -10px; min-width: 18px; height: 18px; padding: 0 4px; background: var(--warm); color: var(--warn-ink); font-style: normal; display: flex; align-items: center; justify-content: center">3</i></span><span>待我处理</span></button>
    <button type="button" class="tab"><svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="10" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/><rect x="17" y="10" width="4" height="4"/></svg><span>更多</span></button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#2F7A4F","options":["#2F7A4F","#2563A8","#9A3F8C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const picked = this.props.accent ?? '#2F7A4F';
    const accent = dark && picked.toUpperCase() === '#2F7A4F' ? '#7DD3A0' : picked;
    return { themeClass: dark ? 'dark' : '', accent };
  }
}
</script>
</body>
</html>
