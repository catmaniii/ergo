<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>E 玻璃光纹 · 任务看板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Chakra+Petch:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457F5}a:hover{color:#1A43C4}
.root{--bg:#EEF1F8;--dot:#C6CDE0;--surface:rgba(255,255,255,0.74);--edge:rgba(255,255,255,0.9);--border:rgba(30,41,82,0.12);--text:#121A33;--muted:#566078;--accent:#2457F5;--accent-ink:#FFFFFF;--accent-soft:rgba(36,87,245,0.12);--glow:0 1px 0 rgba(255,255,255,0.9) inset,0 10px 30px rgba(36,87,245,0.10);--warn:#B8321A;--warn-ink:#FFFFFF;--warn-soft:rgba(184,50,26,0.1)}
.root.dark{--bg:#0B0E1A;--dot:#283052;--surface:rgba(24,29,52,0.72);--edge:rgba(255,255,255,0.12);--border:rgba(255,255,255,0.1);--text:#E8ECFF;--muted:#9AA3C7;--accent:#7C9CFF;--accent-ink:#0B0E1A;--accent-soft:rgba(124,156,255,0.16);--glow:0 1px 0 rgba(255,255,255,0.08) inset,0 10px 30px rgba(0,0,0,0.45);--warn:#FF8A6A;--warn-ink:#2A0E06;--warn-soft:rgba(255,138,106,0.14)}
.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.num{font-family:'Chakra Petch','Noto Sans SC',sans-serif;font-weight:600;letter-spacing:0.02em}
.glass{background:var(--surface);border:1px solid var(--edge);box-shadow:var(--glow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;position:relative}
.tab.on{color:var(--accent);font-weight:700}
.tab.on::after{content:"";position:absolute;bottom:5px;width:18px;height:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.gh{display:flex;align-items:center;gap:8px;padding:4px 4px 2px}
.gh b{font-size:14px;font-weight:700}
.gh span{font-size:11px;color:var(--muted)}
.gh em{margin-left:auto;font-style:normal;font-size:11px;color:var(--accent)}
.card{width:100%;text-align:left;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:15px;font-weight:500;line-height:1.4}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill{font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap}
.p-you{background:var(--warn-soft);color:var(--warn)}
.p-run{background:var(--accent-soft);color:var(--accent)}
.p-idle{border:1px solid var(--border);color:var(--muted)}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.track{height:2px;background:var(--border)}
.fill{height:100%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
</style>
</helmet>
<div class="root {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.3px); background-size: 18px 18px; color: var(--text); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px; line-height: 1.5; --accent: {{accent}}">

  <header class="glass" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 12px 0; padding: 12px 16px; border-radius: 16px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.2">任务看板</h1>
      <div class="num" style="font-size: 11px; color: var(--muted)">5 等我 · 3 进行中 · 4 运营中</div>
    </div>
    <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; box-shadow: 0 6px 18px var(--accent-soft)">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width: 16px; height: 16px"><path d="M12 5v14M5 12h14"/></svg>
      发起任务
    </button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div class="gh"><b>等我</b><span>等我、待确认</span><em class="num">05</em></div>
      <button type="button" class="card glass">
        <div class="top"><h3>季度体检报告整理</h3><span class="pill p-you">等你验收</span></div>
        <div class="track"><div class="fill" style="width: 100%"></div></div>
        <div class="meta"><span class="num">3/3 阶段</span><span class="num">96k token</span><span>昨天 18:00</span></div>
      </button>
      <button type="button" class="card glass">
        <div class="top"><h3>VPS 证书续期检查</h3><span class="pill p-you">中断</span></div>
        <div style="font-size: 12px; color: var(--warn)">不确定续期命令是否已执行，要你核对</div>
        <div class="meta"><span class="num">2/2 阶段</span><span class="num">12k token</span><span>07:02</span></div>
      </button>
      <button type="button" class="card glass">
        <div class="top"><h3>个税年度汇算材料</h3><span class="pill p-you">超预算</span></div>
        <div class="track"><div class="fill" style="width: 66%"></div></div>
        <div class="meta"><span class="num">2/3 阶段</span><span class="num">640k token</span><span>昨天 16:45</span></div>
      </button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div class="gh"><b>进行中</b><span>规划中、排队中、执行中</span><em class="num">03</em></div>
      <button type="button" class="card glass">
        <div class="top"><h3>博客迁移到 Astro</h3><span class="pill p-run">执行中</span></div>
        <div style="font-size: 12px; color: var(--muted)">跑端到端测试 · 项目「个人博客」</div>
        <div class="track"><div class="fill" style="width: 60%"></div></div>
        <div class="meta"><span class="num">3/5 阶段</span><span class="num">356k token</span><span>09:10</span></div>
      </button>
      <button type="button" class="card glass">
        <div class="top"><h3>十一月东京行程</h3><span class="pill p-run">规划中</span></div>
        <div class="meta"><span>和你对齐意图</span><span class="num">8k token</span><span>08:31</span></div>
      </button>
      <button type="button" class="card glass">
        <div class="top"><h3>家庭网盘去重</h3><span class="pill p-idle">排队中</span></div>
        <div class="meta"><span>等项目「家庭网盘」</span></div>
      </button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div class="gh"><b>运营中</b><span>提醒、定时作业</span><em class="num">04</em></div>
      <button type="button" class="card glass">
        <div class="top"><h3>每天 08:00 出早报</h3><span class="pill p-run">运营中</span></div>
        <div class="meta"><span>按我的工作日 08:00</span><span>上次成功</span><span class="num">96k token</span></div>
      </button>
      <button type="button" class="card glass">
        <div class="top"><h3>每天 21:00 汇总当天账单</h3><span class="pill p-you">上次失败</span></div>
        <div class="meta"><span>每天 21:00</span><span>记账本</span><span class="num">214k token</span></div>
      </button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <div class="gh"><b>最近结束</b><span>完成、失败、取消</span><em class="num">03</em></div>
      <button type="button" class="card glass" style="opacity: 0.7">
        <div class="top"><h3>简历更新</h3><span class="pill p-idle">已完成</span></div>
        <div class="meta"><span class="num">2/2 阶段</span><span class="num">88k token</span><span>10-05</span></div>
      </button>
    </section>
  </main>

  <nav class="glass" aria-label="主导航" style="display: flex; margin: 0 12px 12px; padding: 0 4px; border-radius: 18px">
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 0 1 12 4h1a8 8 0 0 1 8 8z"/></svg>
      <span>个人助理</span>
    </button>
    <button type="button" class="tab on" aria-current="page">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8 12 3 3 5-6"/></svg>
      <span>任务</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>项目</span>
    </button>
    <button type="button" class="tab">
      <span style="position: relative; display: flex">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <i class="num" style="position: absolute; top: -4px; right: -9px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 6px; background: var(--warn); color: var(--warn-ink); font-size: 10px; font-style: normal; display: flex; align-items: center; justify-content: center">3</i>
      </span>
      <span>待我处理</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span>更多</span>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#2457F5","options":["#2457F5","#7C3AED","#0E8A7D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const picked = this.props.accent ?? '#2457F5';
    const accent = dark && picked.toUpperCase() === '#2457F5' ? '#7C9CFF' : picked;
    return { themeClass: dark ? 'dark' : '', accent };
  }
}
</script>
</body>
</html>
