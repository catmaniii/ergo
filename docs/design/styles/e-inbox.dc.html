</head>

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;family=Chakra+Petch:wght@600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457F5}a:hover{color:#1A43C4}
.root{--bg:#EEF1F8;--dot:#C6CDE0;--surface:rgba(255,255,255,0.74);--edge:rgba(255,255,255,0.9);--border:rgba(30,41,82,0.12);--text:#121A33;--muted:#566078;--accent:#2457F5;--accent-ink:#FFFFFF;--accent-soft:rgba(36,87,245,0.12);--glow:0 1px 0 rgba(255,255,255,0.9) inset,0 10px 30px rgba(36,87,245,0.10);--warn:#B8321A;--warn-ink:#FFFFFF}
.root.dark{--bg:#0B0E1A;--dot:#283052;--surface:rgba(24,29,52,0.72);--edge:rgba(255,255,255,0.12);--border:rgba(255,255,255,0.1);--text:#E8ECFF;--muted:#9AA3C7;--accent:#7C9CFF;--accent-ink:#0B0E1A;--accent-soft:rgba(124,156,255,0.16);--glow:0 1px 0 rgba(255,255,255,0.08) inset,0 10px 30px rgba(0,0,0,0.45);--warn:#FF8A6A;--warn-ink:#2A0E06}
.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.num{font-family:'Chakra Petch','Noto Sans SC',sans-serif;font-weight:600;letter-spacing:0.02em}
.glass{background:var(--surface);border:1px solid var(--edge);box-shadow:var(--glow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;position:relative}
.tab.on{color:var(--accent);font-weight:700}
.tab.on::after{content:"";position:absolute;bottom:5px;width:18px;height:3px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.seg{flex:1;min-height:40px;border-radius:10px;font-size:13px;color:var(--muted)}
.seg.on{background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 4px 14px var(--accent-soft)}
.gh{font-size:11px;color:var(--muted);padding:6px 4px 2px;display:flex;align-items:center;gap:8px}
.gh::after{content:"";flex:1;height:1px;background:var(--border)}
.row{width:100%;text-align:left;display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:14px}
.dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.dot.read{background:transparent;border:1px solid var(--border);box-shadow:none}
.row h3{margin:0;font-size:14px;font-weight:500;line-height:1.45}
.row.unread h3{font-weight:700}
.row p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.kind{color:var(--accent)}
</style>
</helmet>
<div class="root {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background-color: var(--bg); background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.3px); background-size: 18px 18px; color: var(--text); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px; line-height: 1.5; --accent: {{accent}}">

      <button type="button" class="seg" aria-pressed="false">已归档 <span class="num">2</span></button>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
    <div class="gh">置顶 · 到点的提醒</div>
    <button type="button" class="row glass unread"><i class="dot" aria-label="未读"></i><span style="flex: 1; min-width: 0"><h3>该交房租了</h3><p><span class="kind">提醒</span> · 简单提醒 · <span class="num">09:00</span></p></span></button>

    <div class="gh">卡住任务 · 有时限</div>
    <button type="button" class="row glass unread"><i class="dot" aria-label="未读"></i><span style="flex: 1; min-width: 0"><h3>批准一条命令：rsync --delete 到备份机</h3><p><span class="kind">审批</span> · 任务「家庭照片整理与去重」· <span class="num">09:20</span></p></span></button>
    <button type="button" class="row glass"><i class="dot read"></i><span style="flex: 1; min-width: 0"><h3>授权明天到期：移动重复照片</h3><p><span class="kind">授权到期续期</span> · 任务「家庭照片整理与去重」· <span class="num">08:00</span></p></span></button>

    <div class="gh">卡住任务</div>
    <button type="button" class="row glass unread"><i class="dot" aria-label="未读"></i><span style="flex: 1; min-width: 0"><h3>NAS 硬盘巡检卡住了：smartctl 读不到第 3 块盘</h3><p><span class="kind">卡住求助</span> · 任务「NAS 硬盘健康巡检」· <span class="num">06:30</span></p></span></button>
    <button type="button" class="row glass"><i class="dot read"></i><span style="flex: 1; min-width: 0"><h3>新设备请求配对：iPad</h3><p><span class="kind">配对请求</span> · 系统 · 昨天 <span class="num">22:14</span></p></span></button>

    <div class="gh">不卡任务</div>
    <button type="button" class="row glass"><i class="dot read"></i><span style="flex: 1; min-width: 0"><h3>昨晚的备份没写进同步目录</h3><p><span class="kind">备份失败</span> · 系统 · <span class="num">03:31</span></p></span></button>
    <button type="button" class="row glass"><i class="dot read"></i><span style="flex: 1; min-width: 0"><h3>越界通知：维护者想读 ~/Documents</h3><p><span class="kind">越界通知</span> · 项目「记账本」· 昨天 <span class="num">20:05</span></p></span></button>
  </main>

  <nav class="glass" aria-label="主导航" style="display: flex; margin: 0 12px 12px; padding: 0 4px; border-radius: 18px">
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 0 1 12 4h1a8 8 0 0 1 8 8z"/></svg>
      <span>个人助理</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8 12 3 3 5-6"/></svg>
      <span>任务</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>项目</span>
    </button>
    <button type="button" class="tab on" aria-current="page">
      <span style="position: relative; display: flex">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <i class="num" style="position: absolute; top: -4px; right: -9px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 6px; background: var(--warn); color: var(--warn-ink); font-size: 10px; font-style: normal; display: flex; align-items: center; justify-content: center">3</i>
      </span>
      <span>待我处理</span>

    <button type="button" class="tab">

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#2457F5","options":["#2457F5","#7C3AED","#0E8A7D"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const picked = this.props.accent ?? '#2457F5';
    const accent = dark && picked.toUpperCase() === '#2457F5' ? '#7C9CFF' : picked;
    return { themeClass: dark ? 'dark' : '', accent };
  }
}
</script>
