<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>B 净白格栅 · 任务看板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
.root{--bg:#FFFFFF;--alt:#F5F5F5;--border:#E4E4E4;--text:#111111;--muted:#5F6368;--accent:#C2410C;--accent-ink:#FFFFFF;--ink:#111111;--ink-on:#FFFFFF}
.root.dark{--bg:#0B0B0C;--alt:#19191B;--border:#2A2A2D;--text:#F2F2F2;--muted:#A3A3A3;--accent:#FF8A4C;--accent-ink:#111111;--ink:#F2F2F2;--ink-on:#111111}
.root button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.ic{width:22px;height:22px;flex:none}
.tab{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px}
.tab.on{color:var(--text);font-weight:700}
.gh{display:flex;align-items:baseline;gap:8px;padding:14px 0 6px;border-bottom:1px solid var(--text)}
.gh b{font-size:12px;font-weight:700;letter-spacing:0.12em}
.gh span{font-size:11px;color:var(--muted)}
.gh em{margin-left:auto;font-style:normal;font-size:12px;font-weight:700}
.row{width:100%;text-align:left;display:flex;flex-direction:column;gap:3px;padding:11px 0;border-bottom:1px solid var(--border)}
.row h3{margin:0;font-size:15px;font-weight:500;line-height:1.4}
.row p{margin:0;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}
.you{color:var(--accent);font-weight:700}
.run{color:var(--text);font-weight:500}
</style>
</helmet>
<div class="root {{themeClass}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; --accent: {{accent}}">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--border)">
    <h1 style="margin: 0; font-size: 17px; font-weight: 700">任务看板</h1>
    <button type="button" style="min-height: 44px; padding: 0 4px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 4px">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="width: 16px; height: 16px"><path d="M12 5v14M5 12h14"/></svg>
      发起任务
    </button>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column">
    <section style="display: flex; flex-direction: column">
      <div class="gh"><b>等我</b><span>等我、待确认</span><em>5</em></div>
      <button type="button" class="row">
        <h3>季度体检报告整理</h3>
        <p><span class="you">等我 · 等你验收</span><span>第 3/3 阶段</span><span>9.6 万 token</span><span>昨天 18:00</span></p>
      </button>
      <button type="button" class="row">
        <h3>VPS 证书续期检查</h3>
        <p><span class="you">等我 · 中断：不确定续期命令是否已执行</span><span>第 2/2 阶段</span><span>1.2 万 token</span></p>
      </button>
      <button type="button" class="row">
        <h3>个税年度汇算材料</h3>
        <p><span class="you">等我 · 超预算</span><span>第 2/3 阶段</span><span>64 万 token</span><span>昨天 16:45</span></p>
      </button>
    </section>

    <section style="display: flex; flex-direction: column">
      <div class="gh"><b>进行中</b><span>规划中、排队中、执行中</span><em>3</em></div>
      <button type="button" class="row">
        <h3>博客迁移到 Astro</h3>
        <p><span class="run">执行中 · 跑端到端测试</span><span>第 3/5 阶段</span><span>35.6 万 token</span><span>个人博客</span></p>
      </button>
      <button type="button" class="row">
        <h3>十一月东京行程</h3>
        <p><span class="run">规划中 · 和你对齐意图</span><span>0.8 万 token</span><span>08:31</span></p>
      </button>
      <button type="button" class="row">
        <h3>家庭网盘去重</h3>
        <p><span>排队中 · 等项目「家庭网盘」</span><span>还没开工</span></p>
      </button>
    </section>

    <section style="display: flex; flex-direction: column">
      <div class="gh"><b>运营中</b><span>提醒、定时作业</span><em>4</em></div>
      <button type="button" class="row">
        <h3>每天 08:00 出早报</h3>
        <p><span class="run">运营中 · 上次 08:00 成功</span><span>按我的工作日 08:00</span><span>9.6 万 token</span></p>
      </button>
      <button type="button" class="row">
        <h3>每天 21:00 汇总当天账单</h3>
        <p><span class="you">上次失败 · 21:00 再跑</span><span>每天 21:00</span><span>21.4 万 token</span><span>记账本</span></p>
      </button>
      <button type="button" class="row">
        <h3>交房租</h3>
        <p><span>提醒 · 明天 09:00</span><span>每月 8 号</span></p>
      </button>
      <button type="button" class="row">
        <h3>跑步</h3>
        <p><span>提醒 · 今天 19:00</span><span>每周一、三、五</span></p>
      </button>
    </section>

    <section style="display: flex; flex-direction: column">
      <div class="gh"><b>最近结束</b><span>完成、失败、取消</span><em>3</em></div>
      <button type="button" class="row" style="color: var(--muted)">
        <h3>简历更新</h3>
        <p><span>已完成 · 第 2/2 阶段</span><span>8.8 万 token</span><span>10-05</span></p>
      </button>
      <button type="button" class="row" style="color: var(--muted)">
        <h3>盯特价机票</h3>
        <p><span>失败 · 航司页面改版</span><span>4.1 万 token</span><span>10-04</span></p>
      </button>
    </section>
  </main>

  <nav aria-label="主导航" style="display: flex; padding: 0 4px 10px; border-top: 1px solid var(--border)">
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H8l-4 3v-5.5A8 8 0 0 1 12 4h1a8 8 0 0 1 8 8z"/></svg>
      <span>个人助理</span>
    </button>
    <button type="button" class="tab on" aria-current="page">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 12 3 3 5-6"/></svg>
      <span>任务</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <span>项目</span>
    </button>
    <button type="button" class="tab">
      <span style="position: relative; display: flex">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>
        <i style="position: absolute; top: -3px; right: -8px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 3px; background: var(--accent); color: var(--accent-ink); font-size: 10px; font-weight: 700; font-style: normal; display: flex; align-items: center; justify-content: center">3</i>
      </span>
      <span>待我处理</span>
    </button>
    <button type="button" class="tab">
      <svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      <span>更多</span>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#1D4ED8","#047857"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? false;
    const picked = this.props.accent ?? '#C2410C';
    const accent = dark && picked.toUpperCase() === '#C2410C' ? '#FF8A4C' : picked;
    return { themeClass: dark ? 'dark' : '', accent };
  }
}
</script>
</body>
</html>
