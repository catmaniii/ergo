name: 想要的功能 / Feature request
description: 想让二狗多做点什么、换个做法 / Something ergo should do, or do differently
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve
      description: 你在做什么、哪里不顺手 / What you were doing and what got in the way
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 想怎么做 / What you'd like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 想过的别的办法 / Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: 大概属于哪一块 / Area
      options:
        - 秘书、对话 / Secretary, conversations
        - 任务、项目 / Tasks, projects
        - 守卫、审批、安全 / Guard, approvals, security
        - 记忆 / Memory
        - 插件、数据源 / Plugins, data sources
        - 网页、视觉风格 / Web UI, visual styles
        - 手机、鸿蒙 App、外网访问 / Phone, HarmonyOS app, outside access
        - 安装、服务管家 / Install, supervisor
        - 多语言 / Languages
        - 其他 / Other
  - type: checkboxes
    id: plugin
    attributes:
      label: 做成插件？ / As a plugin?
      options:
        - label: 我觉得它可以做成插件（见 docs/guides/plugin-development.md），也愿意试着写 / It could be a plugin (see docs/guides/plugin-development.md) and I'd like to try writing it
