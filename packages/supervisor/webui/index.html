<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<script>
// 外观（跟随系统 / 浅色 / 深色）在首帧之前就定下来，免得先闪一下深色。
// 选择存在本浏览器里（lsm.theme），主页和日志页共用；「跟随系统」时由下面的模块脚本盯着系统切换。
(function () {
  var pref = 'system';
  try { pref = localStorage.getItem('lsm.theme') || 'system'; } catch (e) {}
  var light = pref === 'light' || (pref === 'system' && !!(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches));
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
})();
</script>
<title>本地服务管理器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 2.5 28 9.5v13L16 29.5 4 22.5v-13z' fill='%230b0e15' stroke='url(%23g)' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M8 17h4l2-5 3.5 9 2.2-6.5 1.3 2.5H24' fill='none' stroke='url(%23g)' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============================================================
   设计说明
   - 状态 = 整卡底色（老规矩，一眼扫过去就知道哪张不对劲）。
     每张卡只设一个 --c（RGB 三元组），底色、左轨、状态灯、徽章全从它派生。
   - 动效只用来表达「在发生什么」，不做装饰：
       呼吸环 = 在跑；转圈 = 启停中；扫光 = 过渡态；斜纹轨 = 正在干活（busy）；
       公网链路上的流动虚线 = 公网**实测可达**（光是隧道进程活着不会流动）。
   - 探活档位画成信号格：process 1 格 … linked 4 格，格数 = 这盏灯保证了多少。
   ============================================================ */
:root{
  --bg:#05070b;
  --surface:#0b0f16;
  --line:rgba(148,163,194,.10);
  --line-2:rgba(148,163,194,.18);
  --fg:#e8ebf2;
  --dim:#8f98ad;
  --faint:#5f6779;
  --green-rgb:52,211,153;
  --amber-rgb:251,191,36;
  --cyan-rgb:34,211,238;
  --red-rgb:251,113,133;
  --gray-rgb:120,128,148;
  --violet-rgb:139,124,255;
  --green:rgb(var(--green-rgb)); --amber:rgb(var(--amber-rgb)); --cyan:rgb(var(--cyan-rgb));
  --red:rgb(var(--red-rgb)); --gray:rgb(var(--gray-rgb)); --violet:rgb(var(--violet-rgb));
  --mono:"Cascadia Code","Cascadia Mono","JetBrains Mono",Consolas,ui-monospace,monospace;
  --sans:"Segoe UI Variable Text","Segoe UI Variable","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  --radius:16px;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
  /* ---- 主题相关：深色（默认）。浅色在下面的 [data-theme="light"] 里整套覆盖 ---- */
  --ink-rgb:255,255,255;              /* 叠在底色上的那层薄色：深色下是白，浅色下是墨 */
  --shadow-rgb:0,0,0; --sh:1;         /* 阴影颜色与浓度：浅色下要淡得多 */
  --hdr-a:rgba(5,7,11,.86); --hdr-b:rgba(5,7,11,.62);
  --panel-a:#131824; --panel-b:#0b0f17;
  --glass:rgba(12,16,24,.92); --scrim:rgba(2,4,8,.62); --well:rgba(0,0,0,.38);
  --term-bg:#030508; --term-fg:#c8d0df; --body-2:#c6ccd8;
  --cid-off:#c5cad5; --sig-on:#d6dbe6; --chain-label:#7d8699;
  --t-red:#fda4b4; --t-amber:#fcd77a; --t-cyan:#9be7f5; --t-cyan-2:#a5f0fc;
  --t-violet:#c4b5fd; --t-violet-2:#cfc6ff; --t-violet-3:#b3a8ff;
  --link:#9fe8f7; --link-hover:#fff;
  /* 在跑 vs 停着：不只靠颜色——在跑的卡片染色、标签实心；停着的几乎不染色、标签空心 */
  --tint-on:1; --tint-off:.22; --on-ok:#03140c;
}
/* 浅色：状态色换成更深的色阶——原来那套霓虹色在白底上当文字几乎看不清 */
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#ffffff;
  --line:rgba(15,23,42,.09); --line-2:rgba(15,23,42,.16);
  --fg:#0f172a; --dim:#475569; --faint:#8590a3;
  --green-rgb:21,128,61; --amber-rgb:217,119,6; --cyan-rgb:8,145,178;
  --red-rgb:225,29,72; --gray-rgb:100,116,139; --violet-rgb:108,92,231;
  --ink-rgb:15,23,42;
  --shadow-rgb:15,23,42; --sh:.22;
  --tint-on:1.4; --tint-off:.12; --on-ok:#ffffff;
  --hdr-a:rgba(243,245,249,.9); --hdr-b:rgba(243,245,249,.72);
  --panel-a:#ffffff; --panel-b:#f8fafc;
  --glass:rgba(255,255,255,.95); --scrim:rgba(15,23,42,.30); --well:rgba(15,23,42,.04);
  --term-bg:#f8fafc; --term-fg:#1e293b; --body-2:#334155;
  --cid-off:#475569; --sig-on:#334155; --chain-label:#64748b;
  --t-red:#be123c; --t-amber:#92400e; --t-cyan:#0e7490; --t-cyan-2:#0e7490;
  --t-violet:#6d28d9; --t-violet-2:#5b21b6; --t-violet-3:#6d28d9;
  --link:#0369a1; --link-hover:#0c4a6e;
}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.hide{display:none!important}
.mono{font-family:var(--mono)}
.faint{color:var(--faint)}
.dim{color:var(--dim)}
.sp{flex:1}
svg.i{width:15px;height:15px;flex:none}
a{color:inherit}
::selection{background:rgba(var(--violet-rgb),.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(var(--ink-rgb),.10);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(var(--ink-rgb),.18);background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 背景：点阵 + 两团极弱的光 ---------- */
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(900px 560px at 6% -10%, rgba(var(--violet-rgb),.17), transparent 62%),
    radial-gradient(760px 520px at 100% -4%, rgba(var(--cyan-rgb),.08), transparent 60%),
    radial-gradient(1100px 700px at 50% 125%, rgba(var(--green-rgb),.05), transparent 60%),
    var(--bg)}
.bgfx::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(rgba(148,163,194,.12) 1px, transparent 1.3px);background-size:24px 24px;
  -webkit-mask-image:radial-gradient(ellipse 90% 75% at 50% 20%, #000 25%, transparent 80%);
          mask-image:radial-gradient(ellipse 90% 75% at 50% 20%, #000 25%, transparent 80%)}
.bgfx::after{content:"";position:absolute;width:70vmax;height:70vmax;left:-20vmax;top:-40vmax;
  background:radial-gradient(closest-side, rgba(var(--violet-rgb),.09), transparent);
  animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(60vw,35vh)}}

/* ---------- 顶栏 ---------- */
.hdr{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--hdr-a),var(--hdr-b));
  -webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}
.hdr-in{max-width:1560px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{width:38px;height:38px;flex:none;filter:drop-shadow(0 0 14px rgba(var(--violet-rgb),.5));transition:filter .4s}
.logo .beat{stroke-dasharray:44;stroke-dashoffset:0;animation:beat 2.8s ease-in-out infinite}
@keyframes beat{0%{stroke-dashoffset:44}45%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-44}}
body.offline .logo{filter:grayscale(1) opacity(.55)}
body.offline .logo .beat{animation:none}
.brand h1{margin:0;font-size:16.5px;font-weight:650;letter-spacing:.02em;white-space:nowrap}
.eyebrow{font:500 10.5px/1.5 var(--mono);color:var(--faint);letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.conn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 13px;border-radius:999px;
  font-size:12px;color:var(--dim);border:1px solid var(--line);background:rgba(var(--ink-rgb),.02);white-space:nowrap;transition:all .3s}
.conn .cd{width:7px;height:7px;border-radius:50%;background:var(--gray)}
.conn.on{color:var(--green);border-color:rgba(var(--green-rgb),.28);background:rgba(var(--green-rgb),.06)}
.conn.on .cd{background:var(--green);animation:ping 2s var(--ease) infinite}
.conn.off{color:var(--red);border-color:rgba(var(--red-rgb),.32);background:rgba(var(--red-rgb),.07)}
.conn.off .cd{background:var(--red);animation:blink 1s steps(2) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(var(--green-rgb),.7)}80%,100%{box-shadow:0 0 0 7px rgba(var(--green-rgb),0)}}
@keyframes blink{50%{opacity:.25}}

.wrap{max-width:1560px;margin:0 auto;padding:24px 28px 64px}

/* ---------- 总览三块 ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:26px}
.stat{position:relative;overflow:hidden;padding:16px 18px 15px;border-radius:var(--radius);border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(var(--ink-rgb),.04),rgba(var(--ink-rgb),.012));
  box-shadow:inset 0 1px 0 rgba(var(--ink-rgb),.04);transition:border-color .4s,background .4s}
.stat::after{content:"";position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(var(--k,var(--violet-rgb)),.16),transparent);pointer-events:none}
.stat .k{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim)}
.stat .k svg{color:rgb(var(--k,var(--violet-rgb)))}
.stat .v{margin-top:6px;font:600 34px/1.15 var(--mono);letter-spacing:-.02em}
.stat .v small{margin-left:6px;font-size:16px;font-weight:500;color:var(--faint);letter-spacing:0}
.stat .note{margin-top:8px;font-size:12px;color:var(--faint);min-height:18px}
.stat .bar{height:4px;margin-top:12px;border-radius:4px;background:rgba(var(--ink-rgb),.06);overflow:hidden}
.stat .bar i{display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,rgba(var(--green-rgb),.45),var(--green));box-shadow:0 0 12px rgba(var(--green-rgb),.7);
  transition:width .7s var(--ease)}
#st-run{--k:var(--green-rgb)} #st-pub{--k:var(--cyan-rgb)} #st-bad{--k:var(--green-rgb)}
#st-bad.hot{--k:var(--red-rgb);border-color:rgba(var(--red-rgb),.38);
  background:linear-gradient(180deg,rgba(var(--red-rgb),.13),rgba(var(--red-rgb),.03))}
#st-bad.hot .v{color:var(--red);text-shadow:0 0 24px rgba(var(--red-rgb),.55)}
#st-bad:not(.hot) .v{color:var(--green)}

/* ---------- 区块标题 ---------- */
.sec{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin:0 0 12px}
.sec h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.06em}
.sec .hint{font-size:12px;color:var(--faint)}

/* ---------- 场景 ---------- */
.profiles{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.prof{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 13px 0 9px;border-radius:12px;cursor:pointer;
  font:500 13px var(--sans);color:var(--fg);border:1px solid var(--line-2);background:rgba(var(--ink-rgb),.025);
  transition:transform .2s var(--ease),border-color .2s,background .2s,box-shadow .2s}
.prof .pic{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;
  background:rgba(var(--violet-rgb),.16);color:var(--violet)}
.prof .pic svg{width:12px;height:12px}
.prof .pn{font-family:var(--mono)}
.prof .segs{display:inline-flex;gap:3px}
.prof .segs i{width:7px;height:14px;border-radius:2.5px;background:rgba(var(--ink-rgb),.09)}
.prof .segs i.on{background:rgb(var(--c));box-shadow:0 0 8px rgba(var(--c),.65)}
.prof .pc{font:500 12px var(--mono);color:var(--dim)}
.prof:hover{transform:translateY(-1px);border-color:rgba(var(--violet-rgb),.5);background:rgba(var(--violet-rgb),.09);
  box-shadow:0 10px 26px -14px rgba(var(--violet-rgb),.9)}
.prof.on .pic{background:rgba(var(--green-rgb),.14);color:var(--green)}
.prof.on:hover{border-color:rgba(var(--green-rgb),.42);background:rgba(var(--green-rgb),.06);box-shadow:0 10px 26px -14px rgba(var(--green-rgb),.8)}

/* ---------- 哨兵 ---------- */
.sentinel{margin-bottom:24px;padding:10px 14px 10px 16px;border-radius:var(--radius);border:1px solid rgba(var(--amber-rgb),.30);
  background:linear-gradient(180deg,rgba(var(--amber-rgb),.10),rgba(var(--amber-rgb),.025))}
.sentinel .sh{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:13px;font-weight:650;color:var(--amber)}
.sentinel .sh svg{animation:spin 4s linear infinite}
.sentinel .sh .tag{margin:0}
.sentinel .stog{height:24px}
/* 一条一行：命令行截断，完整内容在悬停提示里 */
.srow{display:flex;align-items:center;gap:10px;min-width:0;padding:7px 0;border-top:1px solid rgba(var(--amber-rgb),.14);font-size:12.5px;white-space:nowrap}
.srow:first-of-type{margin-top:9px}
.srow .tag{margin:0}
.srow .sc{flex:1;min-width:0;font:11.5px/1.5 var(--mono);color:var(--dim);overflow:hidden;text-overflow:ellipsis;cursor:help}
/* 折叠时：按「项目 + 进程名」归组的小标签 */
.schips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.schips:empty{display:none}
.schip{display:inline-flex;align-items:center;gap:7px;height:24px;padding:0 9px;border-radius:7px;cursor:help;white-space:nowrap;
  font:500 12px var(--sans);color:var(--fg);border:1px solid rgba(var(--cyan-rgb),.28);background:rgba(var(--cyan-rgb),.07)}
.schip i{width:6px;height:6px;border-radius:50%;background:var(--cyan)}
.schip b{font:500 11.5px var(--mono);color:var(--dim)}
.schip .faint{font-size:11.5px}
.schip.task{border-color:rgba(var(--amber-rgb),.32);background:rgba(var(--amber-rgb),.07)}
.schip.task i{background:var(--amber)}
.tag{display:inline-block;margin-right:6px;padding:1px 7px;border-radius:6px;font-size:11px;vertical-align:1px;
  color:var(--amber);background:rgba(var(--amber-rgb),.12);border:1px solid rgba(var(--amber-rgb),.28)}
.tag.red{color:var(--red);background:rgba(var(--red-rgb),.12);border-color:rgba(var(--red-rgb),.32)}
.tag.cy{color:var(--cyan);background:rgba(var(--cyan-rgb),.10);border-color:rgba(var(--cyan-rgb),.28)}

/* ---------- 服务卡 ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:16px}
.card{--c:var(--gray-rgb);--tint:var(--tint-on);position:relative;border-radius:var(--radius);overflow:hidden;
  border:1px solid rgba(var(--c),calc(.20*var(--tint)));
  background:
    radial-gradient(130% 85% at 0% 0%, rgba(var(--c),calc(.15*var(--tint))), transparent 55%),
    linear-gradient(180deg, rgba(var(--c),calc(.075*var(--tint))), rgba(var(--c),calc(.02*var(--tint))) 45%, rgba(var(--ink-rgb),.01)),
    var(--surface);
  box-shadow:inset 0 1px 0 rgba(var(--ink-rgb),.045), 0 22px 44px -26px rgba(var(--shadow-rgb),calc(.85*var(--sh)));
  transition:border-color .4s, box-shadow .4s, transform .35s var(--ease)}
.card::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;
  background:rgb(var(--c));box-shadow:0 0 16px rgba(var(--c),.75);transition:background .4s}
.card:hover{transform:translateY(-2px);border-color:rgba(var(--c),.40);
  box-shadow:inset 0 1px 0 rgba(var(--ink-rgb),.05), 0 0 0 1px rgba(var(--c),.06), 0 26px 50px -24px rgba(var(--c),.30)}
.card.s-RUNNING{--c:var(--green-rgb)}
.card.s-DEGRADED{--c:var(--amber-rgb)}
.card.s-STARTING,.card.s-STOPPING{--c:var(--cyan-rgb)}
.card.s-STOPPED{--c:var(--gray-rgb);--tint:var(--tint-off);border-color:var(--line-2)}
.card.s-STOPPED::before{opacity:.4;box-shadow:none}
.card.s-FAILED,.card.s-ORPHAN{--c:var(--red-rgb)}
.card.s-EXTERNAL{--c:var(--gray-rgb);border-style:dashed;border-color:rgba(var(--c),.30);
  background:linear-gradient(180deg,rgba(var(--ink-rgb),.02),rgba(var(--ink-rgb),.008)),var(--surface)}
.card.s-EXTERNAL::before{background:repeating-linear-gradient(180deg,rgba(var(--c),.8) 0 5px,transparent 5px 10px);box-shadow:none}
.card.busy{--c:var(--amber-rgb)}
.card.busy::before{background:repeating-linear-gradient(180deg,rgb(var(--c)) 0 6px,rgba(var(--c),.22) 6px 12px);
  background-size:100% 24px;animation:march .7s linear infinite}
@keyframes march{to{background-position:0 24px}}
.card.s-STARTING::after,.card.s-STOPPING::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 38%,rgba(var(--cyan-rgb),.11) 50%,transparent 62%);
  background-size:260% 100%;animation:sweep 1.9s linear infinite}
@keyframes sweep{from{background-position:130% 0}to{background-position:-130% 0}}
.card.s-FAILED,.card.s-ORPHAN{box-shadow:inset 0 0 0 1px rgba(var(--red-rgb),.10), inset 0 1px 0 rgba(var(--ink-rgb),.04), 0 22px 44px -26px rgba(var(--red-rgb),.35)}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}

.card{display:flex;flex-direction:column}
.cbody{flex:1;display:flex;flex-direction:column;padding:17px 18px 16px 22px}
.push{flex:1 0 16px}
.c-top{display:flex;align-items:center;gap:11px;min-width:0}
.light{position:relative;width:10px;height:10px;border-radius:50%;flex:none;background:rgb(var(--c));box-shadow:0 0 10px rgba(var(--c),.85)}
.light::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid rgba(var(--c),.65);opacity:0}
.s-RUNNING .light::after,.s-DEGRADED .light::after{animation:ring 2.4s var(--ease) infinite}
@keyframes ring{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.9);opacity:0}}
.s-STARTING .light,.s-STOPPING .light{background:transparent;box-shadow:none;border:2px solid rgba(var(--c),.22);border-top-color:rgb(var(--c));animation:spin .75s linear infinite}
.s-FAILED .light,.s-ORPHAN .light{animation:alarm 1.5s ease-in-out infinite}
@keyframes alarm{50%{box-shadow:0 0 18px 3px rgba(var(--c),.95)}}
.s-STOPPED .light{background:transparent;border:2px solid rgba(var(--c),.75);box-shadow:none}
.s-EXTERNAL .light{background:transparent;border:2px dashed rgba(var(--c),.9);box-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}
.cid{font:600 15.5px/1.3 var(--mono);letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-STOPPED .cid,.s-EXTERNAL .cid{color:var(--cid-off)}
.chip-state{margin-left:auto;flex:none;padding:5px 9px;border-radius:999px;font:650 10.5px/1 var(--mono);letter-spacing:.08em;
  color:rgb(var(--c));background:rgba(var(--c),.12);border:1px solid rgba(var(--c),.30)}
/* 在跑 = 实心标签，停着 = 空心——分不清颜色也能一眼看出来 */
.s-RUNNING .chip-state{color:var(--on-ok);background:rgb(var(--c));border-color:rgb(var(--c));box-shadow:0 0 12px -3px rgba(var(--c),.7)}
.s-STOPPED .chip-state{background:transparent}
.c-name{margin:5px 0 0 21px;font-size:13px;color:var(--dim)}
.c-meta{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.mchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;
  font:500 11.5px var(--mono);color:var(--dim);background:rgba(var(--ink-rgb),.035);border:1px solid var(--line)}
.mchip svg{width:12px;height:12px}
.mchip.tier{cursor:help}
.sig{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.sig i{width:3px;border-radius:1px;background:rgba(var(--ink-rgb),.14)}
.sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:6.5px}.sig i:nth-child(3){height:9px}.sig i:nth-child(4){height:12px}
.sig i.on{background:var(--sig-on)}
.mchip.tier.linked{color:var(--green);border-color:rgba(var(--green-rgb),.32);background:rgba(var(--green-rgb),.07)}
.mchip.tier.linked .sig i.on{background:var(--green);box-shadow:0 0 6px rgba(var(--green-rgb),.8)}
/* 名下的服务：由哪个接入的项目登记 */
.mchip.owner{cursor:help;color:var(--t-cyan);border-color:rgba(var(--cyan-rgb),.28);background:rgba(var(--cyan-rgb),.07)}
.c-detail{display:flex;gap:8px;margin-top:10px;font-size:12.5px;color:var(--dim);word-break:break-all}
.c-detail::before{content:"›";color:var(--faint);font-family:var(--mono)}

.alert{display:flex;align-items:flex-start;gap:9px;margin-top:10px;padding:9px 11px;border-radius:10px;
  font-size:12.5px;line-height:1.55;border:1px solid}
.alert svg{margin-top:2px}
.alert .ab{margin-left:auto;align-self:center}
.alert.warn{color:var(--t-amber);background:rgba(var(--amber-rgb),.08);border-color:rgba(var(--amber-rgb),.24)}
.alert.err{color:var(--t-red);background:rgba(var(--red-rgb),.08);border-color:rgba(var(--red-rgb),.26);word-break:break-all}
.alert.info{color:var(--t-cyan);background:rgba(var(--cyan-rgb),.07);border-color:rgba(var(--cyan-rgb),.22)}

.blk{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.blk-h{margin-bottom:9px;font:650 10.5px/1 var(--sans);letter-spacing:.2em;color:var(--faint)}
.ep{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 12px;align-items:center;font-size:12.5px}
.ep .l{font-size:11.5px;color:var(--faint)}
.ep a{font-family:var(--mono);color:var(--link);text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color .2s}
.ep a:hover{color:var(--link-hover);text-decoration:underline;text-decoration-color:rgba(var(--cyan-rgb),.55);text-underline-offset:3px}
.ep .no{font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:help}

/* 公网链路：本机 —ssh 隧道— VPS —HTTPS— 公网 */
.chain{display:flex;align-items:flex-start;margin:4px 2px 12px}
.node{--n:var(--gray-rgb);display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;min-width:46px}
.node .nd{width:13px;height:13px;border-radius:50%;border:2px solid rgb(var(--n));background:rgba(var(--n),.22);box-shadow:0 0 12px rgba(var(--n),.55)}
.node.lit .nd{background:rgb(var(--n))}
.node .nl{font-size:10.5px;color:var(--faint);white-space:nowrap}
.node .nv{font:500 10.5px/1 var(--mono);color:var(--dim);white-space:nowrap}
.n-ok{--n:var(--green-rgb)} .n-bad{--n:var(--red-rgb)} .n-unk{--n:var(--amber-rgb)} .n-off{--n:var(--gray-rgb)} .n-busy{--n:var(--cyan-rgb)}
.link{position:relative;flex:1;height:2px;margin-top:6px;border-radius:2px;background:rgba(var(--ink-rgb),.08);overflow:hidden}
.linkw{position:relative;flex:1;margin:0 4px}
.linkw .ll{position:absolute;left:50%;top:-2px;transform:translateX(-50%);font:500 10px/1 var(--mono);color:var(--chain-label);white-space:nowrap}
.linkw .link{margin-top:17px}
.link.up{background:rgba(var(--green-rgb),.55)}
.link.flow{background:rgba(var(--green-rgb),.22)}
.link.flow::after{content:"";position:absolute;top:0;bottom:0;left:-16px;right:0;
  background:repeating-linear-gradient(90deg,var(--green) 0 8px,transparent 8px 16px);animation:flow .8s linear infinite}
@keyframes flow{to{transform:translateX(16px)}}
.link.broken{background:repeating-linear-gradient(90deg,rgba(var(--red-rgb),.85) 0 4px,transparent 4px 9px)}
.link.unk{background:repeating-linear-gradient(90deg,rgba(var(--amber-rgb),.6) 0 3px,transparent 3px 8px)}
.exprow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:7px;font-size:12px;white-space:nowrap;
  color:var(--dim);border:1px solid var(--line-2);background:rgba(var(--ink-rgb),.03)}
.badge svg{width:12px;height:12px}
.badge.pub{color:var(--green);border-color:rgba(var(--green-rgb),.34);background:rgba(var(--green-rgb),.08)}
.badge.pub.down{color:var(--red);border-color:rgba(var(--red-rgb),.36);background:rgba(var(--red-rgb),.08);white-space:normal;height:auto;min-height:24px;padding:3px 9px}
.badge.pub.unknown{color:var(--amber);border-color:rgba(var(--amber-rgb),.34);background:rgba(var(--amber-rgb),.08)}
.tmeta{width:100%;margin-top:2px;font-size:12px;color:var(--faint)}
.badge.never{color:var(--t-violet);border-color:rgba(var(--violet-rgb),.42);background:rgba(var(--violet-rgb),.10)}
.neverwhy{flex:1;min-width:0;font-size:12px;line-height:1.5;color:var(--dim)}

.deps{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:13px;font-size:12px;color:var(--faint)}
.dep{--c:var(--gray-rgb);display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;
  font:500 11.5px var(--mono);color:var(--dim);border:1px solid var(--line-2)}
.dep i{width:6px;height:6px;border-radius:50%;background:rgb(var(--c));box-shadow:0 0 6px rgba(var(--c),.8)}
.dep.soft{border-style:dashed}

.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)}
.acts>a.btn:last-child{margin-left:auto}   /* 按钮多到换行时，「日志」仍然靠右 */

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:9px;cursor:pointer;white-space:nowrap;
  font:500 12.5px var(--sans);color:var(--fg);border:1px solid var(--line-2);background:rgba(var(--ink-rgb),.035);
  transition:background .2s,border-color .2s,box-shadow .2s,color .2s,transform .12s}
.btn svg{width:14px;height:14px}
.btn:hover:not(:disabled){background:rgba(var(--ink-rgb),.075);border-color:rgba(var(--ink-rgb),.24)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn:focus-visible{outline:2px solid rgba(var(--violet-rgb),.85);outline-offset:2px}
.btn.d:focus-visible{outline-color:rgba(var(--red-rgb),.85)}
.btn.go svg{color:var(--green)}
.btn.go:hover:not(:disabled){border-color:rgba(var(--green-rgb),.5);background:rgba(var(--green-rgb),.10);box-shadow:0 0 20px -6px rgba(var(--green-rgb),.75)}
.btn.halt svg{color:var(--red)}
.btn.halt:hover:not(:disabled){border-color:rgba(var(--red-rgb),.45);background:rgba(var(--red-rgb),.08)}
.btn.cyc svg{color:var(--cyan)}
.btn.cyc:hover:not(:disabled){border-color:rgba(var(--cyan-rgb),.45);background:rgba(var(--cyan-rgb),.08)}
.btn.d{color:var(--t-red);border-color:rgba(var(--red-rgb),.38);background:rgba(var(--red-rgb),.09)}
.btn.d:hover:not(:disabled){background:rgba(var(--red-rgb),.18);border-color:rgba(var(--red-rgb),.6);box-shadow:0 0 20px -6px rgba(var(--red-rgb),.7)}
.btn.p{color:#fff;border-color:rgba(var(--violet-rgb),.9);
  background:linear-gradient(180deg,rgba(var(--violet-rgb),.95),rgba(115,98,255,.78));box-shadow:0 10px 26px -12px rgba(var(--violet-rgb),.95)}
.btn.p:hover:not(:disabled){background:linear-gradient(180deg,rgb(160,148,255),rgba(var(--violet-rgb),.9));border-color:rgb(170,160,255)}
.btn.ghost{background:transparent}
.btn.sm{height:26px;padding:0 9px;border-radius:7px;font-size:12px}
.btn.sm svg{width:12px;height:12px}
.btn[aria-pressed="true"]{color:var(--t-cyan-2);border-color:rgba(var(--cyan-rgb),.45);background:rgba(var(--cyan-rgb),.10)}

a.btn{text-decoration:none}

/* ---------- 开机自启开关：亮 = 开机后管理器会把它拉起来；虚线 = 开机不管它 ---------- */
.boot{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px 0 7px;border-radius:7px;cursor:pointer;
  font:500 11.5px var(--sans);white-space:nowrap;color:var(--faint);border:1px dashed var(--line-2);background:transparent;
  transition:color .2s,border-color .2s,background .2s,box-shadow .25s}
.boot svg{width:12px;height:12px}
.boot:hover{color:var(--dim);border-color:rgba(var(--violet-rgb),.55);background:rgba(var(--violet-rgb),.06)}
.boot.on{color:var(--t-violet-2);border:1px solid rgba(var(--violet-rgb),.5);background:rgba(var(--violet-rgb),.14);
  box-shadow:0 0 16px -6px rgba(var(--violet-rgb),.95)}
.boot.on svg{color:var(--t-violet-3);filter:drop-shadow(0 0 4px rgba(var(--violet-rgb),.9))}
.boot.on:hover{background:rgba(var(--violet-rgb),.22)}
.boot:focus-visible{outline:2px solid rgba(var(--violet-rgb),.85);outline-offset:2px}
.exprow .boot{margin-left:0}
.bootsum{display:inline-flex;align-items:center;gap:7px;margin-left:auto;font-size:12px;color:var(--faint);min-width:0}
.bootsum svg{width:13px;height:13px;color:var(--violet);flex:none}
.bootsum b{font:500 12px var(--mono);color:var(--t-violet-2)}
.bootsum.err{color:var(--red)}

/* ---------- 图例 ---------- */
.legend{margin-top:36px;padding:16px 18px;border-radius:var(--radius);border:1px solid var(--line);background:rgba(var(--ink-rgb),.015)}
.legend .lh{font-size:12.5px;color:var(--dim);margin-bottom:12px}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px 22px}
.lgi{display:flex;gap:11px;align-items:flex-start;font-size:12.5px;color:var(--dim)}
.lgi .sig{margin-top:4px}
.lgi b{color:var(--fg);font:600 12.5px var(--mono)}

/* ---------- 提示条 ---------- */
.toast{position:fixed;right:24px;bottom:24px;z-index:70;display:flex;align-items:center;gap:11px;max-width:460px;
  padding:12px 16px 12px 13px;border-radius:13px;font-size:13px;border:1px solid var(--line-2);
  background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 24px 60px -16px rgba(var(--shadow-rgb),calc(.9*var(--sh)));transition:transform .35s var(--ease),opacity .35s}
.toast.out{transform:translateY(18px);opacity:0;pointer-events:none}
.toast .ti{width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center}
.toast .ti svg{width:14px;height:14px}
.toast.ok{border-color:rgba(var(--green-rgb),.38)} .toast.ok .ti{color:var(--green);background:rgba(var(--green-rgb),.13)}
.toast.bad{border-color:rgba(var(--red-rgb),.42)} .toast.bad .ti{color:var(--red);background:rgba(var(--red-rgb),.13)}
.toast.pending{border-color:rgba(var(--cyan-rgb),.32)} .toast.pending .ti{background:rgba(var(--cyan-rgb),.10)}
.spin{width:13px;height:13px;border-radius:50%;border:2px solid rgba(var(--cyan-rgb),.25);border-top-color:var(--cyan);animation:spin .7s linear infinite}

/* ---------- 对话框（代替浏览器原生 confirm / alert） ---------- */
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;
  background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mbox{width:min(540px,100%);padding:22px 22px 20px;border-radius:18px;border:1px solid var(--line-2);
  background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
  box-shadow:inset 0 1px 0 rgba(var(--ink-rgb),.05), 0 50px 100px -30px rgba(var(--shadow-rgb),calc(.95*var(--sh))), 0 0 70px -30px rgba(var(--violet-rgb),.6);
  animation:pop .28s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.mbox.danger{border-color:rgba(var(--red-rgb),.42);box-shadow:inset 0 1px 0 rgba(var(--ink-rgb),.05), 0 50px 100px -30px rgba(var(--shadow-rgb),calc(.95*var(--sh))), 0 0 70px -30px rgba(var(--red-rgb),.65)}
.mhead{display:flex;align-items:center;gap:13px}
.mic{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;color:var(--violet);
  background:rgba(var(--violet-rgb),.15);border:1px solid rgba(var(--violet-rgb),.35)}
.mic svg{width:18px;height:18px}
.danger .mic{color:var(--red);background:rgba(var(--red-rgb),.13);border-color:rgba(var(--red-rgb),.38)}
.mtitle{font-size:15.5px;font-weight:650}
.mbody{margin-top:15px;font-size:13.5px;line-height:1.75;color:var(--body-2);white-space:pre-line}
.mpre{margin:15px 0 0;max-height:48vh;overflow:auto;padding:12px 14px;border-radius:11px;border:1px solid var(--line-2);
  background:var(--term-bg);font:12px/1.6 var(--mono);color:var(--term-fg);white-space:pre-wrap;word-break:break-all}
.mfoot{display:flex;align-items:center;gap:10px;margin-top:22px}
.mfoot .sp{flex:1}

/* ---------- 登录 ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lbox{width:min(380px,100%);padding:36px 30px 26px;border-radius:22px;text-align:center;border:1px solid var(--line-2);
  background:linear-gradient(180deg,var(--panel-a),var(--panel-b));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(var(--ink-rgb),.05), 0 50px 120px -40px rgba(var(--violet-rgb),.45);animation:pop .4s var(--ease)}
.lock{width:58px;height:58px;margin:0 auto 18px;border-radius:17px;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 30% 20%,rgba(var(--violet-rgb),.55),rgba(var(--violet-rgb),.12));
  border:1px solid rgba(var(--violet-rgb),.55);box-shadow:0 0 44px -6px rgba(var(--violet-rgb),.75)}
.lock svg{width:24px;height:24px}
.ltitle{font-size:18px;font-weight:650}
.lsub{margin-top:7px;font-size:12.5px;color:var(--dim)}
.lbox input{width:100%;height:46px;margin:24px 0 14px;padding:0 15px;border-radius:12px;border:1px solid var(--line-2);
  background:var(--well);color:var(--fg);font:15px var(--mono);letter-spacing:.12em;outline:none;transition:border-color .2s,box-shadow .2s}
.lbox input:focus{border-color:rgba(var(--violet-rgb),.75);box-shadow:0 0 0 4px rgba(var(--violet-rgb),.18)}
.lbox .btn{width:100%;height:44px;justify-content:center;font-size:14px}
.lerr{min-height:20px;margin-top:12px;font-size:12.5px;color:var(--red)}

/* ---------- 简略卡片：一眼看更多服务；细节收进悬停提示，或切回详细 ---------- */
.grid.mini{grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px}
.card.mini .cbody{padding:12px 12px 11px 16px}
.card.mini::before{top:12px;bottom:12px;width:2.5px}
.card.mini .c-top{gap:9px}
.card.mini .light{width:8px;height:8px}
.card.mini .cid{font-size:13.5px}
.card.mini .chip-state{padding:4px 7px;font-size:9.5px}
.card.mini .push{flex:1 0 10px}
.m-meta{display:flex;align-items:center;gap:5px;margin-top:9px;min-height:22px;overflow:hidden}
.m-meta .mchip{height:22px;padding:0 7px;gap:5px;font-size:11px}
a.mchip{text-decoration:none;transition:color .2s,border-color .2s}
a.mchip:hover{color:var(--fg);border-color:rgba(var(--cyan-rgb),.5)}
.mpub,.mboot,.mnote{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;border:1px solid var(--line);text-decoration:none}
.mpub svg,.mboot svg,.mnote svg{width:12px;height:12px}
.mpub.ok{color:var(--green);border-color:rgba(var(--green-rgb),.35);background:rgba(var(--green-rgb),.08)}
.mpub.bad{color:var(--red);border-color:rgba(var(--red-rgb),.38);background:rgba(var(--red-rgb),.08)}
.mpub.unk{color:var(--amber);border-color:rgba(var(--amber-rgb),.35);background:rgba(var(--amber-rgb),.08)}
.mboot{color:var(--t-violet-3);border-color:rgba(var(--violet-rgb),.4);background:rgba(var(--violet-rgb),.10)}
.mnote{cursor:help}
.mnote.err{color:var(--red);border-color:rgba(var(--red-rgb),.38);background:rgba(var(--red-rgb),.08)}
.mnote.warn{color:var(--amber);border-color:rgba(var(--amber-rgb),.35);background:rgba(var(--amber-rgb),.08)}
.m-acts{display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding-top:9px;border-top:1px solid var(--line)}
.mext{font-size:11.5px}
.ib{display:inline-grid;place-items:center;width:30px;height:27px;border-radius:8px;cursor:pointer;color:var(--fg);text-decoration:none;
  border:1px solid var(--line-2);background:rgba(var(--ink-rgb),.035);transition:background .2s,border-color .2s,box-shadow .2s,transform .12s}
.ib svg{width:13px;height:13px}
.ib:hover:not(:disabled){background:rgba(var(--ink-rgb),.075);border-color:rgba(var(--ink-rgb),.24)}
.ib:active:not(:disabled){transform:translateY(1px)}
.ib:disabled{opacity:.28;cursor:not-allowed}
.ib:focus-visible{outline:2px solid rgba(var(--violet-rgb),.85);outline-offset:2px}
.ib.go svg{color:var(--green)}
.ib.go:hover:not(:disabled){border-color:rgba(var(--green-rgb),.5);background:rgba(var(--green-rgb),.10)}
.ib.halt svg{color:var(--red)}
.ib.halt:hover:not(:disabled){border-color:rgba(var(--red-rgb),.45);background:rgba(var(--red-rgb),.08)}
.ib.cyc svg{color:var(--cyan)}
.ib.cyc:hover:not(:disabled){border-color:rgba(var(--cyan-rgb),.45);background:rgba(var(--cyan-rgb),.08)}
.ib.d{color:var(--t-red);border-color:rgba(var(--red-rgb),.38);background:rgba(var(--red-rgb),.09)}

/* ---------- Tailnet 栏：本机节点 + 网关 + serve，一行 ---------- */
.tnbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;margin-bottom:24px;padding:9px 14px 9px 16px;border-radius:var(--radius);
  border:1px solid rgba(var(--violet-rgb),.26);background:linear-gradient(180deg,rgba(var(--violet-rgb),.08),rgba(var(--violet-rgb),.02));font-size:12.5px}
.tnbar .tn-h{display:inline-flex;align-items:center;gap:7px;font-weight:650;color:var(--t-violet)}
.tnbar .tn-h svg{width:14px;height:14px}
.tnbar .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:var(--faint)}
.tnbar .dot.ok{background:var(--green);box-shadow:0 0 8px rgba(var(--green-rgb),.8)}
.tnbar .dot.bad{background:var(--red)}
.tnbar .tn-peers{cursor:help;text-decoration:underline dotted rgba(var(--ink-rgb),.3);text-underline-offset:3px}
.tnbar .mchip{height:24px}
.tnbar .boot{margin-left:0}
.tnbar a.btn{height:26px}
.tnbar .bad{color:var(--t-red)}
/* ---------- VPS 费用栏：余额 / 到期 / 流量一行，要提醒时整条变色、下面逐条列 ---------- */
.vpsbar{margin-bottom:24px;padding:9px 14px 9px 16px;border-radius:var(--radius);font-size:12.5px;
  border:1px solid rgba(var(--cyan-rgb),.24);background:linear-gradient(180deg,rgba(var(--cyan-rgb),.07),rgba(var(--cyan-rgb),.015))}
.vpsbar.warn{border-color:rgba(var(--amber-rgb),.5);background:linear-gradient(180deg,rgba(var(--amber-rgb),.11),rgba(var(--amber-rgb),.02))}
.vpsbar.bad{border-color:rgba(var(--red-rgb),.55);background:linear-gradient(180deg,rgba(var(--red-rgb),.11),rgba(var(--red-rgb),.02))}
.vpsbar .vrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px}
.vpsbar .tn-h{display:inline-flex;align-items:center;gap:7px;font-weight:650;color:var(--t-cyan)}
.vpsbar .tn-h svg{width:14px;height:14px}

  font:500 12px var(--sans);color:var(--faint);background:transparent;transition:color .2s,background .2s,box-shadow .2s}
.theme button svg{width:13px;height:13px}
.theme button:hover{color:var(--fg)}
.theme button[aria-pressed="true"]{color:var(--fg);background:var(--surface);
  box-shadow:inset 0 0 0 1px var(--line-2), 0 1px 3px rgba(var(--shadow-rgb),calc(.5*var(--sh)))}
.theme button:focus-visible{outline:2px solid rgba(var(--violet-rgb),.85);outline-offset:1px}
@media (max-width:760px){ .theme button span{display:none} .theme button{padding:0 7px} }

/* ---------- 窄屏 ---------- */

}

  *,*::before,*::after{animation:none!important;transition:none!important}
}

<body>

<div id="app" class="hide">
  <header class="hdr">
    <div class="hdr-in">
      <div class="brand">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
          <path d="M16 2.5 28 9.5v13L16 29.5 4 22.5v-13z" fill="rgba(139,124,255,.10)" stroke="url(#lg)" stroke-width="1.6" stroke-linejoin="round"/>
          <path class="beat" d="M8 17h4l2-5 3.5 9 2.2-6.5 1.3 2.5H24" fill="none" stroke="url(#lg)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        </div>
      </div>

      <div class="theme" role="group" aria-label="外观">
        <button type="button" data-set-theme="system" aria-pressed="false" title="外观跟随系统设置"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></svg><span>跟随系统</span></button>
        <button type="button" data-set-theme="light" aria-pressed="false" title="浅色"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><span>浅色</span></button>

  <main class="wrap">
    <section class="stats" id="stats"></section>

    <div class="sec"><h2>场景</h2><span class="hint">一键按依赖顺序启动一组服务</span></div>
    <div class="profiles" id="profiles"></div>

    <div class="sec"><h2>服务</h2><span class="hint">隧道和 tailnet 网关不单独占卡片——隧道并在所暴露服务的「公网」那一栏里，网关在上面的 Tailnet 栏</span><span class="bootsum" id="bootsum"></span>
      <div class="theme viewsw" role="group" aria-label="卡片样式">
        <button type="button" data-a="view" data-set-view="full" aria-pressed="true" title="详细卡片：入口、公网链路、依赖都摆出来"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="7.5" height="16" rx="1.6"/><rect x="13" y="4" width="7.5" height="16" rx="1.6"/></svg><span>详细</span></button>
        <button type="button" data-a="view" data-set-view="mini" aria-pressed="false" title="简略卡片：一眼看更多服务的状态"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="4.5" height="7" rx="1.2"/><rect x="9.75" y="4" width="4.5" height="7" rx="1.2"/><rect x="16" y="4" width="4.5" height="7" rx="1.2"/><rect x="3.5" y="13" width="4.5" height="7" rx="1.2"/><rect x="9.75" y="13" width="4.5" height="7" rx="1.2"/><rect x="16" y="13" width="4.5" height="7" rx="1.2"/></svg><span>简略</span></button>
      </div></div>
    <div class="grid" id="grid"></div>

    <section class="legend">
      <div class="lh">探活档位决定这盏灯保证了什么：</div>
      <div class="lg" id="legend"></div>
    </section>
  </main>
</div>

<div id="toast" class="toast out" role="status" aria-live="polite"></div>
<div id="modal" class="modal hide"></div>

<script type="module">
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- 外观（跟随系统 / 浅色 / 深色）
// 选择是本浏览器自己的偏好，存 localStorage（读写都包 try：隐私模式下它可能直接抛错，页面照常按系统走）。
const THEME_KEY = 'lsm.theme';
const sysLight = matchMedia('(prefers-color-scheme: light)');
const readTheme = () => { try { return localStorage.getItem(THEME_KEY) || 'system'; } catch { return 'system'; } };
function applyTheme(pref) {
  const light = pref === 'light' || (pref === 'system' && sysLight.matches);
  document.documentElement.dataset.theme = light ? 'light' : 'dark';
  for (const b of document.querySelectorAll('[data-set-theme]')) b.setAttribute('aria-pressed', String(b.dataset.setTheme === pref));
}
sysLight.addEventListener('change', () => { if (readTheme() === 'system') applyTheme('system'); });   // 跟随系统：系统一切就跟着切
window.addEventListener('storage', (e) => { if (e.key === THEME_KEY) applyTheme(readTheme()); });  // 另一个标签页改了，这边也跟着变
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-set-theme]');
  if (!b) return;
  try { localStorage.setItem(THEME_KEY, b.dataset.setTheme); } catch {}
  applyTheme(b.dataset.setTheme);
});
applyTheme(readTheme());

let state = null;
const cards = new Map();            // id → { el, body, sig, cls } —— 按 id 复用 DOM，不再每秒整片重建
let profSig = '', sentSig = '', statSig = '', bootSig = '';
// 本浏览器自己的显示偏好（卡片样式、哨兵展开与否）：存 localStorage，读写都包 try，读不到就用默认
const pref = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let view = pref.get('lsm.view', 'full') === 'mini' ? 'mini' : 'full';
let sentinelOpen = pref.get('lsm.sentinel.open', '0') === '1';

const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const UP = ['RUNNING', 'DEGRADED'];
const RGB = { RUNNING:'--green-rgb', DEGRADED:'--amber-rgb', STARTING:'--cyan-rgb', STOPPING:'--cyan-rgb',
  STOPPED:'--gray-rgb', FAILED:'--red-rgb', ORPHAN:'--red-rgb', EXTERNAL:'--gray-rgb' };
const rgbVar = (st) => `var(${RGB[st] || '--gray-rgb'})`;

const TIER_HINT = {
  linked:'接入中：服务正在跟管理器对话，健康与忙碌都是它自己报的，精度最高',
  health:'健康检查通过：HTTP 探活拿到了预期响应',
  port:'只知道端口有人在听——证明不了服务真的能干活',
  process:'只知道进程还在——ssh 进程活着但隧道已断时，这盏灯依然是绿的',
};
const TIER_LEVEL = { process:1, port:2, health:3, linked:4 };
const CAP_HINT = {
  stop:'该服务未提供停机能力。接入统一层后由它自己实现停机；现在只能强制停止（直接杀进程树，会丢正在进行的工作）',
  restart:'该服务未提供重启能力',
  start:'该服务未提供启动能力',
};
const ACT_LABEL = { 'vps-refresh':'查询 VPS 费用', start:'启动', stop:'停止', restart:'重启', 'profile-start':'启动场景', 'expose-on':'接通公网', 'tailnet-close':'撤销 tailnet 入口',
  'expose-off':'断开公网', 'cancel-stop':'取消停机', orphan:'处理孤儿', 'detach-task':'摘除自启任务', 'autostart-set':'开机自启' };

const ICON = {
  wallet:'<path d="M4 7.5V6.8A2.3 2.3 0 0 1 6.3 4.5H17v3"/><rect x="3.5" y="7.5" width="17" height="12" rx="2.4"/><path d="M15.5 13.5h2"/>',
  play:'<path d="M7.5 4.8v14.4L19.5 12z" fill="currentColor" stroke="none"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2.4" fill="currentColor" stroke="none"/>',
  restart:'<path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4.5v5h-5"/>',
  log:'<path d="M5 7l4 4-4 4"/><path d="M12 17h7"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 1 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 1 0 5.66 5.66l1-1"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  bolt:'<path d="M13 3 5 13.5h6.5L10.5 21 19 10.5h-6.5z"/>',
  alert:'<path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.3M12 17v.4"/>',
  pause:'<path d="M9 6v12M15 6v12"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8v.3"/>',
  clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12 18.4 5.6"/>',
  mesh:'<circle cx="6" cy="6.5" r="2.3"/><circle cx="18" cy="6.5" r="2.3"/><circle cx="12" cy="17.5" r="2.3"/><path d="M8.3 6.5h7.4M7.2 8.5l3.6 7M16.8 8.5l-3.6 7"/>',
  pulse:'<path d="M3 12h4l2.5-6 4 12 2.5-6H21"/>',
  shield:'<path d="M12 3 5 6v5.5c0 4.4 3 8 7 9.5 4-1.5 7-5.1 7-9.5V6z"/>',
  home:'<path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/>',
  power:'<path d="M12 3.5v8"/><path d="M6.7 7.2a7.5 7.5 0 1 0 10.6 0"/>',
  ext:'<path d="M14 4h6v6"/><path d="M20 4l-8.5 8.5"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
};
ICON.unlink = ICON.link + '<path d="M3.5 3.5l17 17"/>';
const ic = (n) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ''}</svg>`;
const sig = (tier) => { const l = TIER_LEVEL[tier] || 0; return `<span class="sig">${[1,2,3,4].map((n) => `<i class="${n <= l ? 'on' : ''}"></i>`).join('')}</span>`; };

// ---------------------------------------------------------------- 提示条 & 对话框
function toast(msg, kind = 'pending') {
  const t = $('toast');
  const icon = kind === 'ok' ? ic('check') : kind === 'bad' ? ic('x') : '<span class="spin"></span>';
  t.className = 'toast ' + kind;
  t.innerHTML = `<span class="ti">${icon}</span><span>${esc(msg)}</span>`;
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.add('out'), 5200);
}

/** 代替原生 confirm / alert：同样的问题、同样的两种结局（确定 / 取消），Enter 确定、Esc 取消。 */
function uiModal({ title, body = '', pre = '', ok = '确定', cancel = '取消', danger = false, icon = 'info', alertOnly = false, copy = false }) {
  return new Promise((resolve) => {
    const m = $('modal'), prev = document.activeElement;
    m.innerHTML = `<div class="mbox ${danger ? 'danger' : ''}" role="dialog" aria-modal="true" aria-labelledby="mtitle">
      <div class="mhead"><span class="mic">${ic(icon)}</span><div class="mtitle" id="mtitle">${esc(title)}</div></div>
      ${body ? `<div class="mbody">${esc(body)}</div>` : ''}
      ${pre ? `<pre class="mpre">${esc(pre)}</pre>` : ''}
      <div class="mfoot">
        ${copy ? `<button class="btn" data-m="copy">${ic('check')}复制</button>` : ''}
        <span class="sp"></span>
        ${alertOnly ? '' : `<button class="btn" data-m="no">${esc(cancel)}</button>`}
        <button class="btn ${danger ? 'd' : 'p'}" data-m="yes">${esc(ok)}</button>
      </div></div>`;
    m.classList.remove('hide');
    m.querySelector('[data-m=yes]').focus();
    const done = (v) => {
      m.classList.add('hide'); m.innerHTML = ''; m.onclick = null;
      document.removeEventListener('keydown', onKey, true);
      try { prev?.focus?.(); } catch {}
      resolve(v);
    };
    const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); done(alertOnly); } };
    document.addEventListener('keydown', onKey, true);
    m.onclick = async (e) => {
      if (e.target === m) return done(alertOnly);           // 点遮罩 = 取消
      const b = e.target.closest('[data-m]'); if (!b) return;
      if (b.dataset.m === 'copy') {
        try { await navigator.clipboard.writeText(pre); b.lastChild.textContent = '已复制'; }
        catch { b.lastChild.textContent = '复制失败，请手动选中'; }
        return;
      }
      done(b.dataset.m === 'yes');
    };
  });
}

// ---------------------------------------------------------------- 工具
function dur(ms) {
  if (!ms) return '';
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return s + '秒';
  if (s < 3600) return Math.floor(s / 60) + '分';
  if (s < 86400) return Math.floor(s / 3600) + '小时' + Math.floor(s % 3600 / 60) + '分';
  return Math.floor(s / 86400) + '天' + Math.floor(s % 86400 / 3600) + '小时';
}

async function api(path, opts) {
  const r = await fetch(path, { credentials: 'same-origin', ...opts });
  if (r.status === 401) { showLogin(); throw new Error('需要登录'); }
  return await r.json();
}

// ---------------------------------------------------------------- 动作（与原版逐条对应）
async function act(action, id, extra = {}) {
  const what = id ?? extra.task ?? '';
  toast(`${extra.force ? '强制停止' : (ACT_LABEL[action] || action)} ${what} …`);
  try {
    const r = await api('/api/action', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, id, ...extra }),
    });
    toast(r.ok ? `${what || ACT_LABEL[action] || action} 完成` : (r.why || '失败'), r.ok ? 'ok' : 'bad');
  } catch (e) { toast(e.message, 'bad'); }
}

async function createExposure(id) {
  if (!await uiModal({ title: '开通公网入口', icon: 'globe', ok: '开通',
    body: `给 ${id} 开通公网入口？\n\n管理器会在本机建一条到 VPS 的 ssh 反向隧道，并把配置写进注册表。\n它不会去动 VPS 上的任何配置——nginx 站点仍需你自己加，稍后会把该贴的片段给你。` })) return;
  toast(`正在给 ${id} 开通公网…`);
  try {
    const r = await api('/api/action', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'expose-create', id }),
    });
    if (!r.ok) return toast(r.why || '失败', 'bad');
    await uiModal({ title: '已开通', icon: 'check', alertOnly: true, ok: '好', pre: r.note || '已开通', copy: !!r.note });
  } catch (e) { toast(e.message, 'bad'); }
}

async function openTailnet(id) {
  const s = (state?.services || []).find((x) => x.id === id) || {};
  const host = `${s.tailnetName}.${state?.tailnet?.domain}`;
  if (!await uiModal({ title: '开通 tailnet 入口', icon: 'mesh', ok: '开通',
    body: `给 ${id} 开一个只在 tailnet 里能打开的 HTTPS 地址：\nhttps://${host}/\n\n`
      + `管理器会：\n· 在 VPS 上给这个名字签证书${state?.tailnet?.stopUnits?.length ? `（第一次签会让 ${state.tailnet.stopUnits.join('、')} 停约 10 秒）` : ''}\n`
      + `· 在 headscale 里加一条 DNS 记录，把这个名字在 tailnet 里指向本机\n`
      + `· 起本机的 tailnet 网关，让 tailscale serve 把 tailnet 上的 443 交给它\n\n`
      + `连的是 ${id} 的对外端口 :${s.tailnetPort}。公网上打不开这个地址。` })) return;
  toast(`正在给 ${id} 开 tailnet 入口（签证书要十几秒）…`);
  try {
    const r = await api('/api/action', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'tailnet-open', id }),
    });
    if (!r.ok) return toast(r.why || '失败', 'bad');
    toast(`${id} 的 tailnet 入口已开`, 'ok');
    await uiModal({ title: '已开通', icon: 'check', alertOnly: true, ok: '好', pre: r.note || r.url, copy: true });
  } catch (e) { toast(e.message, 'bad'); }
}

async function closeTailnet(id) {
  if (!await uiModal({ title: '撤销 tailnet 入口', icon: 'mesh', ok: '撤销', danger: true,
    body: `撤销 ${id} 的 tailnet 入口？\n\n手机上的地址会立刻打不开；VPS 上的 DNS 记录一起撤掉（证书留着，下次再开不用重签）。\n这是最后一个入口的话，网关和 tailscale serve 也一起停掉。` })) return;
  act('tailnet-close', id);
}

// 忙碌时：确定 = 等空闲后再停 / 再重启，取消 = 什么都不做（行为与原版一致）
async function stopSvc(id, busy) {
  if (busy && !await uiModal({ title: `停止 ${id}`, icon: 'pause', ok: '等空闲后再停',
    body: '这个服务正在跑任务，现在停会中断它。\n\n确定后会等它空闲了再停（管理器不会自己强杀它）；取消则什么都不做。\n等不了的话，用卡片上的「强制停止」。' })) return;
  act('stop', id, { mode: busy ? 'when-idle' : 'now' });
}
async function restartSvc(id, busy) {
  if (busy && !await uiModal({ title: `重启 ${id}`, icon: 'restart', ok: '等空闲后再重启',
    body: '这个服务正在跑任务，重启会中断它。\n\n确定后会等它空闲了再重启；取消则什么都不做。' })) return;
  act('restart', id, { mode: busy ? 'when-idle' : 'now' });
}
// 强制停止：不管忙不忙、有没有排队的「等空闲再停」。有停机能力的先让它立刻停，10 秒（FORCE_GRACE_MS）内没停下就杀进程树
async function forceKill(id) {
  const s = (state?.services || []).find((x) => x.id === id);
  const graceful = (s?.capabilities || []).includes('stop');
  const how = graceful
    ? '不等它空闲：先让它立刻停，10 秒内没停下就直接杀掉进程树。'
    : `${id} 没有停机能力，会直接杀掉进程树。`;
  const busy = s?.busy ? `\n\n它正在跑任务：${s.busyReason || '未说明'}——会被中断。` : '';
  const queued = s?.pendingStop ? '\n之前排队的「等空闲再停」会被这次覆盖。' : '';
  if (!await uiModal({ title: `强制停止 ${id}`, icon: 'bolt', danger: true, ok: '强制停止',
    body: `${how}${busy}${queued}\n\n没保存的工作会丢。` })) return;
  act('stop', id, { force: true });
}
/** 开机自启开关：写的是 registry/autostart.yaml，下次开机（新的登录会话）才生效，不会现在就起停任何东西。 */
async function toggleBoot(id, on) {
  toast(`${on ? '加入' : '移出'}开机自启：${id} …`);
  try {
    const r = await api('/api/action', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'autostart-set', id, on }),
    });
    toast(r.ok ? (on ? `${id} 已加入开机自启——下次开机会自动拉起` : `${id} 已移出开机自启——下次开机不再拉起`) : (r.why || '失败'), r.ok ? 'ok' : 'bad');
  } catch (e) { toast(e.message, 'bad'); }
}
const logHref = (id) => `/logs.html?id=${encodeURIComponent(id)}`;
Object.assign(window, { act, createExposure, stopSvc, restartSvc, forceKill, toggleBoot });

// 所有按钮走一个委托：不在 HTML 里拼 JS 字符串（原版「摘除」按钮就是被引号截断的）
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const id = b.dataset.id;
  const busy = !!(state?.services || []).find((s) => s.id === id)?.busy;
  switch (b.dataset.a) {
    case 'start': return act('start', id);
    case 'stop': return stopSvc(id, busy);
    case 'restart': return restartSvc(id, busy);
    case 'adopt': return act('orphan', id, { decision: 'adopt' });
    case 'kill': return act('orphan', id, { decision: 'kill' });
    case 'force': return forceKill(id);
    case 'boot': return toggleBoot(id, b.dataset.on !== '1');
    case 'expose': return act(b.dataset.on === '1' ? 'expose-off' : 'expose-on', id);
    case 'create-exposure': return createExposure(id);
    case 'tailnet-open': return openTailnet(id);
    case 'tailnet-close': return closeTailnet(id);
    case 'vps-refresh': return act('vps-refresh');
    case 'vps-howto': return vpsHowto();
    case 'cancel-stop': return act('cancel-stop', id);
    case 'profile': return act('profile-start', b.dataset.name);
    case 'detach': return act('detach-task', null, { task: b.dataset.task });
    case 'view': return setView(b.dataset.setView);
    case 'sentinel-toggle':
      sentinelOpen = !sentinelOpen;
      pref.set('lsm.sentinel.open', sentinelOpen ? '1' : '0');
      return renderSentinel();
  }
});

// ---------------------------------------------------------------- 渲染
function renderStats(svcs) {
  const own = svcs.filter((s) => s.kind !== 'external' && !s.tunnelFor && s.role !== 'gateway');
  const running = own.filter((s) => UP.includes(s.state)).length;
  const bad = svcs.filter((s) => ['FAILED', 'ORPHAN'].includes(s.state)).length;
  const pubs = svcs.filter((s) => s.exposure?.scope === 'public');
  const reach = pubs.filter((s) => s.exposure.publicCheck?.ok).length;
  const k = [running, own.length, pubs.length, reach, bad].join();
  if (k === statSig) return;
  statSig = k;
  $('v-run').textContent = running;
  $('v-own').textContent = '/ ' + own.length;
  $('b-run').style.width = own.length ? (running / own.length * 100) + '%' : '0';
  $('n-run').textContent = own.length - running ? `${own.length - running} 个没在跑` : '全部在跑';
  $('v-pub').textContent = pubs.length;
  $('n-pub').textContent = pubs.length ? `其中 ${reach} 个实测可达` : '经 VPS 反向隧道出网';
  $('v-bad').textContent = bad;
  $('n-bad').textContent = bad ? '失败或孤儿，见下方红色卡片' : '没有失败或孤儿';
  $('st-bad').classList.toggle('hot', bad > 0);
}

function renderProfiles(svcs) {
  const html = Object.entries(state.profiles || {}).map(([name, ids]) => {
    const on = ids.filter((i) => svcs.find((s) => s.id === i && UP.includes(s.state))).length;
    const all = on === ids.length;
    const segs = ids.map((i) => {
      const st = svcs.find((s) => s.id === i)?.state || 'STOPPED';
      return `<i class="${UP.includes(st) ? 'on' : ''}" style="--c:${rgbVar(st)}" title="${esc(i)} · ${esc(st)}"></i>`;
    }).join('');
    return `<button class="prof ${all ? 'on' : ''}" data-a="profile" data-name="${esc(name)}" title="场景 ${esc(name)}：${esc(ids.join('、'))}">
      <span class="pic">${ic(all ? 'check' : 'play')}</span><span class="pn">${esc(name)}</span>
      <span class="segs">${segs}</span><span class="pc">${on}/${ids.length}</span></button>`;
  }).join('');
  if (html !== profSig) { $('profiles').innerHTML = html; profSig = html; }
}

function renderBootSum() {
  const list = state.bootList || [];
  const html = state.bootListError
    ? `${ic('alert')}<span>${esc(state.bootListError)}</span>`
    : list.length
      ? `${ic('power')}<span>开机自启 ${list.length} 个：</span><b>${list.map(esc).join('、')}</b>`
      : `${ic('power')}<span>开机自启：还没勾选任何服务——开机后只有管理器自己起来</span>`;
  if (html === bootSig) return;
  bootSig = html;
  const el = $('bootsum');
  el.className = 'bootsum' + (state.bootListError ? ' err' : '');
  el.innerHTML = html;
}

/** 开机自启开关。外部服务管理器管不了生死，不给开关。 */
function bootBtn(id, on, blocked, label = '开机自启') {
  if (blocked) return '';
  const tip = on ? '开机后管理器会自动拉起它。点一下取消' : '开机后不会自动拉起。点一下加入开机自启';
  return `<button class="boot ${on ? 'on' : ''}" data-a="boot" data-id="${esc(id)}" data-on="${on ? 1 : 0}" aria-pressed="${!!on}" title="${tip}">${ic('power')}${label}</button>`;
}

/**
 * 哨兵横幅。默认折叠：一行摘要 + 按「项目 + 进程名」归组的小标签（悬停看端口和命令行），
 * 因为一个项目的测试 worker 一次就能占十几个端口，逐条列出来就是一整屏。
 * 「重复自启」例外——那是要你动手摘除的，永远整行显示。
 */
function renderSentinel() {
  const sn = state.sentinel || {};
  const dup = sn.duplicateTasks || [], tasks = sn.tasks || [], ports = sn.ports || [];
  const n = dup.length + tasks.length + ports.length;
  let html = '';
  if (n) {
    const groups = new Map();
    for (const p of ports) {
      const k = `${p.project || ''}|${p.name}`;
      if (!groups.has(k)) groups.set(k, { project: p.project, name: p.name, items: [] });
      groups.get(k).items.push(p);
    }
    const counts = [
      dup.length && `<span class="tag red">重复自启 ${dup.length}</span>`,
      ports.length && `<span class="tag cy">未纳管的服务 ${ports.length}</span>`,
      tasks.length && `<span class="tag">未纳管的自启任务 ${tasks.length}</span>`,
    ].filter(Boolean).join('');
    const row = (tag, main, cmd) => `<div class="srow">${tag}${main}<code class="sc" title="${esc(cmd)}">${esc(cmd)}</code></div>`;
    const dupRows = dup.map((t) => `<div class="srow"><span class="tag red">重复自启</span><b>${esc(t.name)}</b>
        <span class="faint sx">已纳管，但这个自启任务还在——两个东西抢同一个服务</span>
        <code class="sc" title="${esc(t.action)}">${esc(t.action)}</code>
        <button class="btn d sm" data-a="detach" data-task="${esc(t.name)}">${ic('x')}摘除</button></div>`).join('');
    const body = sentinelOpen
      ? [...groups.values()].flatMap((g) => g.items).map((p) => row('<span class="tag cy">未纳管</span>',
          `<b class="mono">:${esc(p.port)}</b><span>${esc(p.name)} <span class="faint">(${esc(p.pid)})</span></span>`, p.cmd || '')).join('')
        + tasks.map((t) => row('<span class="tag">自启任务</span>', `<b>${esc(t.name)}</b>`, t.action || '')).join('')
      : `<div class="schips">${[...groups.values()].map((g) => {
          const portList = g.items.map((p) => ':' + p.port).join(' ');
          const procs = new Set(g.items.map((p) => p.pid)).size;
          const tip = `${g.name} · ${procs} 个进程\n端口 ${portList}\n${g.items[0].cmd || ''}`;
          return `<span class="schip" title="${esc(tip)}"><i></i>${esc(g.project || '其他目录')}<span class="faint">${esc(g.name)}</span>`
            + `<b>${g.items.length === 1 ? esc(':' + g.items[0].port) : g.items.length + ' 个端口'}</b></span>`;
        }).join('')}${tasks.map((t) => `<span class="schip task" title="${esc(t.action || '')}"><i></i>${esc(t.name)}<span class="faint">自启任务</span></span>`).join('')}</div>`;
    html = `<section class="sentinel">
      <div class="sh">${ic('radar')}<span>哨兵发现 ${n} 项</span>${counts}<span class="sp"></span>
        <button class="btn sm ghost stog" data-a="sentinel-toggle" aria-expanded="${sentinelOpen}">${sentinelOpen ? '收起明细' : '展开明细'}</button></div>
      ${dupRows}${body}
    </section>`;
  }
  if (html !== sentSig) { $('sentinel').innerHTML = html; sentSig = html; }
}

/** 卡片样式：详细 / 简略。只是本浏览器的显示偏好。 */
function setView(v) {
  view = v === 'mini' ? 'mini' : 'full';
  pref.set('lsm.view', view);
  render();
}
function syncViewSwitch() {
  for (const b of document.querySelectorAll('[data-set-view]')) b.setAttribute('aria-pressed', String(b.dataset.setView === view));
  $('grid').classList.toggle('mini', view === 'mini');
}

/**
 * 名下的服务：接入的项目经协议登记的服务，标明「由 X 登记」。
 * 它和手写的服务一样归管理器管——卡片上照样能启停、开关开机自启；撤销用 `lsm owned remove <id>`。
 */
function ownerChip(s, full) {
  if (!s.owner) return '';
  const tip = `由 ${s.owner} 经接入协议登记${s.registeredAt ? `（${s.registeredAt.slice(0, 10)}）` : ''}。`
    + `它是独立的常驻服务，${s.owner} 掉线、重启都不影响它；你照样可以在这里启停。撤销：lsm owned remove ${s.id}`;
  return `<span class="mchip owner" title="${esc(tip)}">${ic('link')}${full ? `由 ${esc(s.owner)} 登记` : esc(s.owner)}</span>`;
}

/** 简略卡片：状态一眼可见 + 最常用的几个操作。入口、公网链路、依赖、报错全文都收进悬停提示，或者切回详细。 */
function miniHTML(s) {
  const caps = s.capabilities || [];
  const can = (c) => caps.includes(c);
  const idA = `data-id="${esc(s.id)}"`;
  const e = s.exposure || {};
  const badges = [];
  const chips = [`<span class="mchip tier" title="${esc((s.tier || '-') + '：' + (TIER_HINT[s.tier] || ''))}">${sig(s.tier)}</span>`];
  if (s.port) {
    chips.push(s.urls?.local
      ? `<a class="mchip" href="${esc(s.urls.local)}" target="_blank" rel="noopener" title="打开 ${esc(s.urls.local)}">:${esc(s.port)}</a>`
      : `<span class="mchip">:${esc(s.port)}</span>`);
  }
  if (s.runningSince) chips.push(`<span class="mchip" title="已运行">${ic('clock')}<span data-since-short="${s.runningSince}"></span></span>`);
  if (s.owner) chips.push(ownerChip(s, false));
  if (e.scope === 'public') {
    const up = UP.includes(e.viaState), c = e.publicCheck;
    const k = !up ? 'bad' : c?.ok ? 'ok' : c ? 'bad' : 'unk';
    const tip = !up ? '公网已断：隧道没在跑' : c?.ok ? `公网可达 ${c.status}` : c ? `隧道在跑但公网打不通（${c.why || c.status}）` : '公网还没实测';
    badges.push(e.publicUrl && up
      ? `<a class="mpub ${k}" href="${esc(e.publicUrl)}" target="_blank" rel="noopener" title="${esc(tip + ' · ' + e.publicUrl)}">${ic('globe')}</a>`
      : `<span class="mpub ${k}" title="${esc(tip)}">${ic('globe')}</span>`);
  }
  if (s.tailnet) {
    const v = tnVerdict(s.tailnet.check);
    badges.push(`<a class="mpub ${v.cls === '' ? 'ok' : v.cls === 'down' ? 'bad' : 'unk'}" href="${esc(s.tailnet.url)}" target="_blank" rel="noopener" title="${esc(v.label + ' · ' + s.tailnet.url)}">${ic('mesh')}</a>`);
  }
  if (s.autostart) badges.push(`<span class="mboot" title="开机自启">${ic('power')}</span>`);
  const note = s.orphanWhy ? `孤儿：${s.orphanWhy}` : (s.lastError || (s.pendingStop ? '待停机：等它空闲后会自己停' : '') || (s.busy ? `正在跑任务：${s.busyReason || '未说明'}` : ''));
  if (note) badges.push(`<span class="mnote ${s.orphanWhy || s.lastError ? 'err' : 'warn'}" title="${esc(note)}">${ic('alert')}</span>`);

  const ib = (a, icon, cls, title, disabled) =>
    `<button class="ib ${cls}" data-a="${a}" ${idA} title="${esc(title)}" aria-label="${esc(title)}" ${disabled ? 'disabled' : ''}>${ic(icon)}</button>`;
  let acts = '<span class="faint mext">外部服务</span>';
  if (s.kind !== 'external') {
    const live = ['RUNNING', 'DEGRADED', 'STARTING'].includes(s.state);
    acts = [
      ib('start', 'play', 'go', can('start') ? '启动' : CAP_HINT.start, live || !can('start')),
      can('stop') || s.state === 'STOPPED'
        ? ib('stop', 'stop', 'halt', can('stop') ? '停止' : CAP_HINT.stop, s.state === 'STOPPED' || !can('stop'))
        : ib('force', 'bolt', 'd', '强制停止（它没有停机能力，直接杀进程树，正在进行的工作会丢）', false),
      ib('restart', 'restart', 'cyc', can('restart') ? '重启' : CAP_HINT.restart, s.state === 'STOPPED' || !can('restart')),
      can('stop') && !['STOPPED', 'ORPHAN'].includes(s.state) ? ib('force', 'bolt', 'halt', '强制停止：不等空闲，10 秒内没停下就杀进程树', false) : '',
      s.state === 'ORPHAN' ? ib('adopt', 'check', 'd', '认领：把占着端口的进程认作这个服务', false) + ib('kill', 'x', 'd', '杀掉占着端口的进程', false) : '',
      s.pendingStop ? ib('cancel-stop', 'x', '', '取消排队中的停机', false) : '',
    ].join('');
  }
  return `
    <div class="c-top">
      <span class="light"></span>
      <span class="cid" title="${esc(s.name || s.id)}">${esc(s.id)}</span>
      <span class="chip-state">${esc(s.state)}</span>
    </div>
    <div class="m-meta">${chips.join('')}</div>
    <div class="push"></div>
    <div class="m-acts">${acts}<span class="sp"></span>${badges.join('')}<a class="ib" href="${logHref(s.id)}" target="_blank" rel="noopener" title="在新标签页里看它的全部命令行输出" aria-label="日志">${ic('log')}</a></div>`;
}

function urlsBlock(s) {
  const u = s.urls || {};
  const host = (x) => x.replace(/^https?:\/\//, '');
  const a = (href, text) => `<a href="${esc(href)}" target="_blank" rel="noopener" title="${esc(href)}">${esc(text)}</a>`;
  const rows = [];
  if (u.local) rows.push(['本地', a(u.local, host(u.local))]);
  if (u.lan) rows.push(['局域网', a(u.lan, host(u.lan))]);
  else if (u.lanWhy) rows.push(['局域网', `<span class="no" title="${esc(u.lanWhy)}">✗ ${esc(u.lanWhy)}</span>`]);
  if (u.public) rows.push(['公网', a(u.public, host(u.public).replace(/\/$/, ''))]);
  if (s.tailnet) rows.push(['Tailnet', a(s.tailnet.url, host(s.tailnet.url).replace(/\/$/, ''))]);
  if (!rows.length) return '';
  return `<div class="blk"><div class="blk-h">入口</div><div class="ep">${rows.map(([l, v]) => `<span class="l">${l}</span>${v}`).join('')}</div></div>`;
}

/**
 * 公网一栏。刻意把「隧道进程在跑」和「公网真的打得通」分开——
 * 前者只是 process 档的绿灯，后者才是实测（「隧道进程活着但连接已断」的坑）。
 * 链路图上只有**实测可达**时虚线才会流动；光是隧道进程活着，线是静止的。
 */
function exposureBlock(s) {
  const e = s.exposure || {};
  if (e.scope !== 'public') {
    if (s.exposureNever) {
      // 注册表里写了 exposure.never：这是一条禁令，不是「还没开」——不给按钮，把理由摆出来
      return `<div class="blk"><div class="blk-h">公网</div><div class="exprow">
        <span class="badge never">${ic('shield')}永不上公网</span>
        <span class="neverwhy">${esc(s.exposureNever)}</span>
      </div></div>`;
    }
    return `<div class="blk"><div class="blk-h">公网</div><div class="exprow">
      <span class="badge">${ic('home')}仅本地</span>
      ${s.canCreateExposure
        ? `<button class="btn sm" data-a="create-exposure" data-id="${esc(s.id)}">${ic('globe')}开通公网</button>`
        : `<span class="faint">（${esc(s.exposureBlockedWhy || '没有端口或未配 VPS，开不了公网')}）</span>`}
      ${tnOpenBtn(s)}
    </div></div>${tailnetBlock(s)}`;
  }
  const tunnelUp = UP.includes(e.viaState);
  const chk = e.publicCheck;
  let cls = 'unknown', label = '公网 · 未实测';
  if (!tunnelUp) { cls = 'down'; label = '公网已断'; }
  else if (chk?.ok) { cls = ''; label = `公网可达 ${chk.status}`; }
  else if (chk) { cls = 'down'; label = `隧道在跑但公网打不通（${chk.why || chk.status}）`; }
  else if (e.publicUrl) { cls = 'unknown'; label = '公网 · 等待实测'; }
  else { cls = 'unknown'; label = '公网已接通隧道（未填 URL，无法实测）'; }

  const verified = tunnelUp && !!chk?.ok;
  const n1 = UP.includes(s.state) ? 'ok' : ['STARTING', 'STOPPING'].includes(s.state) ? 'busy' : ['FAILED', 'ORPHAN'].includes(s.state) ? 'bad' : 'off';
  const n2 = tunnelUp ? 'ok' : 'bad';
  const n3 = !tunnelUp ? 'bad' : chk?.ok ? 'ok' : chk ? 'bad' : 'unk';
  const l1 = !tunnelUp ? 'broken' : verified ? 'flow' : 'up';
  const l2 = !tunnelUp ? '' : verified ? 'flow' : chk ? 'broken' : 'unk';
  const node = (k, name, val) => `<div class="node n-${k} ${k === 'ok' ? 'lit' : ''}"><span class="nd"></span><span class="nl">${name}</span><span class="nv">${esc(val)}</span></div>`;
  const link = (k, name) => `<div class="linkw"><span class="ll">${name}</span><div class="link ${k}"></div></div>`;
  const pubVal = !tunnelUp ? '—' : chk ? (chk.status ?? '✗') : '?';

  return `<div class="blk"><div class="blk-h">公网链路</div>
    <div class="chain">
      ${node(n1, '本机', (e.localPort ?? s.port) ? ':' + (e.localPort ?? s.port) : '')}
      ${link(l1, 'ssh 隧道')}
      ${node(n2, 'VPS', ':' + (e.remotePort ?? '?'))}
      ${link(l2, 'HTTPS')}
      ${node(n3, '公网', pubVal)}
    </div>
    <div class="exprow">
      <span class="badge pub ${cls}">${ic(cls === '' ? 'check' : cls === 'down' ? 'x' : 'pulse')}${esc(label)}</span>
      <span class="sp"></span>

/** tailnet 入口通不通：网关、DNS、serve 三段（手机那一段从本机测不到）。 */
function tnVerdict(k) {
  if (!k) return { cls: 'unknown', label: 'tailnet · 等待实测' };
  if (k.ok) return { cls: '', label: 'tailnet 就绪' };
  const why = [
    !k.gateway?.ok && `网关 ${k.gateway?.status ?? k.gateway?.why ?? '没回话'}`,
    !k.dns?.ok && 'DNS 没指到本机',
    !k.serve?.ok && 'serve 没配',
    k.cert && !k.cert.ok && '证书有问题',
  ].filter(Boolean).join('，');
  return { cls: 'down', label: `tailnet 不通（${why || '原因不明'}）` };
}

function tailnetBlock(s) {
  if (!s.tailnet) return '';
  const k = s.tailnet.check;
  const v = tnVerdict(k);
  const host = s.tailnet.url.replace(/^https:\/\//, '').replace(/\/$/, '');
  const meta = k ? [
    `网关 ${k.gateway?.status ?? k.gateway?.why ?? '?'}`,
    `DNS ${k.dns?.ok ? '→ 本机' : '✗ ' + (k.dns?.ips?.join(',') || k.dns?.why || '')}`,
    `serve :443 ${k.serve?.ok ? '→ 网关' : '✗'}`,
    k.cert?.notAfter ? `证书到 ${new Date(k.cert.notAfter).toISOString().slice(0, 10)}` : (k.cert?.why || ''),
  ].filter(Boolean).join(' · ') : '';
  return `<div class="blk"><div class="blk-h">TAILNET</div><div class="exprow">
      <span class="badge pub ${v.cls}">${ic(v.cls === '' ? 'check' : v.cls === 'down' ? 'x' : 'pulse')}${esc(v.label)}</span>
      <a class="tnurl" href="${esc(s.tailnet.url)}" target="_blank" rel="noopener" title="只在 tailnet 里能打开">${esc(host)}</a>
      <span class="sp"></span>
      <button class="btn sm" data-a="tailnet-close" data-id="${esc(s.id)}">${ic('unlink')}撤销</button>
      <div class="tmeta">${esc(meta)}${k ? ` · <span data-ago="${k.checkedAt}"></span>` : ''} · 手机那一段要在手机上打开才算数</div>
    </div></div>`;
}

let firstPaint = true;
function renderGrid(svcs) {
  const grid = $('grid');
  const seen = new Set();
  const mini = view === 'mini';
  syncViewSwitch();
  // 纯隧道（被某个服务引用）不单独占卡片——它是那个服务公网那条腿
  svcs.filter((s) => !s.tunnelFor && s.role !== 'gateway').forEach((s, i) => {
    seen.add(s.id);
    let c = cards.get(s.id);
    if (!c) {
      const el = document.createElement('article');
      el.innerHTML = '<div class="cbody"></div>';
      c = { el, body: el.firstChild, sig: '', cls: '' };
      cards.set(s.id, c);
      el.style.animation = `rise .55s var(--ease) ${firstPaint ? i * 35 : 0}ms both`;
      el.addEventListener('animationend', (ev) => { if (ev.target === el) el.style.animation = ''; });
    }
    const cls = `card s-${s.state}` + (s.busy ? ' busy' : '') + (mini ? ' mini' : '');
    if (c.cls !== cls) { c.el.className = cls; c.cls = cls; }
    const html = mini ? miniHTML(s) : cardHTML(s, svcs);
    if (c.sig !== html) { c.body.innerHTML = html; c.sig = html; }
    if (grid.children[i] !== c.el) grid.insertBefore(c.el, grid.children[i] || null);
  });
  for (const [id, c] of cards) if (!seen.has(id)) { c.el.remove(); cards.delete(id); }
  firstPaint = false;
}

// 只走字的部分（运行时长、「N 秒前确认」）单独刷，卡片本身不重建——动画不会每秒重播
function durShort(ms) {
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h' + Math.floor(s % 3600 / 60) + 'm';
  return Math.floor(s / 86400) + 'd' + Math.floor(s % 86400 / 3600) + 'h';
}
function tick() {
  for (const el of document.querySelectorAll('[data-since]')) el.textContent = dur(+el.dataset.since);
  for (const el of document.querySelectorAll('[data-since-short]')) el.textContent = durShort(+el.dataset.sinceShort);
  for (const el of document.querySelectorAll('[data-ago]'))
    el.textContent = `${Math.max(0, Math.round((Date.now() - +el.dataset.ago) / 1000))} 秒前确认`;
}

// ---------------------------------------------------------------- 鉴权：SCRAM-SHA-256，口令不上网
const hex2buf = (h) => new Uint8Array(h.match(/../g).map((b) => parseInt(b, 16)));
async function hmac(key, msg) {
  const k = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(msg)));
}
window.doLogin = async () => {
  const pw = $('pw').value;
  $('loginerr').textContent = '';
  try {
    const c = await (await fetch('/api/auth/challenge', { method: 'POST' })).json();
    const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const salted = new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt: hex2buf(c.salt), iterations: c.iterations, hash: 'SHA-256' }, key, 256));
    const clientKey = await hmac(salted, 'Client Key');
    const storedKey = new Uint8Array(await crypto.subtle.digest('SHA-256', clientKey));
    const sig = await hmac(storedKey, c.nonce);
    const proof = clientKey.map((b, i) => b ^ sig[i]);
    const r = await (await fetch('/api/auth/verify', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
      body: JSON.stringify({ nonce: c.nonce, proof: btoa(String.fromCharCode(...proof)) }),
    })).json();
    if (!r.ok) { $('loginerr').textContent = r.why || '口令不对'; return; }
    if (r.cookie) document.cookie = r.cookie.replace(/;\s*HttpOnly/i, '');
    location.reload();
  } catch (e) { $('loginerr').textContent = '登录出错：' + e.message; }
};
$('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') window.doLogin(); });

  state = await api('/api/state');
  render();
  connect();
  setInterval(() => { if (state) render(); }, 1000);   // 走字（卡片按签名比对，没变就不碰 DOM）
})();
</script>
</body>
