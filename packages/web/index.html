<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>二狗</title>
    <script>
      // 外观、视觉风格和经典的主色：页面脚本加载前就按这台设备记住的选择定下外观、风格和主色，
      // 不先闪一下另一种颜色、另一套风格。
      // 和 src/app/theme.ts 做的是同一件事（键名、地址栏颜色、字体样式表、主色都一样），改一处要改另一处（test/app/theme.test.ts 比对两边）。
      (function () {
        // 风格清单里每套风格的地址栏颜色、字体样式表、可选的主色：构建时由 build/visual-styles-plugin.ts 填进来
        var STYLES = /*VISUAL_STYLES*/ {};
        var choice = null;
        var style = null;
        var accent = null;
        try {
          choice = localStorage.getItem("ergo-theme");
          style = localStorage.getItem("ergo-style");
          accent = localStorage.getItem("ergo-accent");
        } catch (e) {
          // 存储用不了：跟随系统、经典、默认的主色
        }
        if (choice !== "light" && choice !== "dark") choice = null;
        // 没选过、清单里没有了：默认的经典（和 src/state/visual-style.ts 的 DEFAULT_VISUAL_STYLE 一样，测试比对）
        if (!style || !Object.prototype.hasOwnProperty.call(STYLES, style)) style = "classic";
        var info = STYLES[style];
        var dark = choice ? choice === "dark" : typeof matchMedia === "function" && matchMedia("(prefers-color-scheme: dark)").matches;
        if (choice) document.documentElement.setAttribute("data-theme", choice);
        document.documentElement.setAttribute("data-style", style);
        document.querySelector('meta[name="color-scheme"]').setAttribute("content", choice || "light dark");
        if (!info) return;
        if (info.accents) {
          // 这套风格能换主色（经典）：记住的认识就用，不认识、没选过的用第一种（和 src/state/visual-style.ts 的 accentOf 一样）
          if (info.accents.indexOf(accent) < 0) accent = info.accents[0];
          document.documentElement.setAttribute("data-accent", accent);
        }
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? info.bar.dark : info.bar.light);
        if (info.fonts) {
          // 这套风格自己的字体：只在选了它时才挂，按 unicode-range 只下页面上用到的字；没下好时先用系统字体
          var link = document.createElement("link");
          link.setAttribute("rel", "stylesheet");
          link.setAttribute("href", info.fonts);
          link.setAttribute("data-style-fonts", "");
          document.head.appendChild(link);
        }
      })();
    </script>
    <script>
      // 界面字号：页面脚本加载前就按这台设备、这种屏幕形态（窄屏、中屏、宽屏）记住的比例写好根元素的 --fs-k 和
      // data-font-scale（调大 up、调小 down），不先闪一下原来的大小。和 src/app/font-scale.ts、src/state/font-scale.ts
      // 做的是同一件事（形态的分界、键名、范围和步长都一样），改一处要改另一处（test/app/font-scale.test.ts 比对两边的结果）。
      (function () {
        var width = window.innerWidth || 0;
        var form = width >= 840 ? "wide" : width >= 600 ? "medium" : "narrow";
        var raw = null;
        try {
          raw = localStorage.getItem("ergo-font-scale-" + form);
        } catch (e) {
          // 存储用不了：就是 1
        }
        if (raw === null || String(raw).trim() === "") return;
        var scale = Number(raw);
        if (!isFinite(scale)) return;
        scale = Math.round(Math.min(1.5, Math.max(0.85, scale)) / 0.05) / 20;
        if (scale === 1) return;
        document.documentElement.style.setProperty("--fs-k", String(scale));
        document.documentElement.setAttribute("data-font-scale", scale > 1 ? "up" : "down");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
